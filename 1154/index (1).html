/* Renders every page of a PDF as a stacked series of canvases inside the
   given container, so the test paper / answer key always display inline
   in the app (an <iframe src="file.pdf"> just triggers a download on many
   mobile browsers instead of showing the PDF). Only renders once per container. */
const _pdfRenderCache = {};
const _pdfZoomLevels = {}; // containerId -> current zoom % (100 = fit width)
function zoomPdf(containerId, deltaPct){
  const container = document.getElementById(containerId);
  if(!container) return;
  const current = _pdfZoomLevels[containerId] || 100;
  const next = Math.max(50, Math.min(300, current + deltaPct));
  _pdfZoomLevels[containerId] = next;
  container.style.width = next + '%';
  const label = document.getElementById('pdfZoomLabel-' + containerId);
  if(label) label.textContent = next + '%';
}
function renderPdfInto(containerId, url){
  const container = document.getElementById(containerId);
  if(!container) return;
  if(_pdfRenderCache[containerId] === url) return; // already rendered
  if(typeof pdfjsLib === 'undefined'){
    container.innerHTML = '<div class="pdf-loading">PDF viewer unavailable</div>';
    return;
  }
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  _pdfRenderCache[containerId] = url;
  pdfjsLib.getDocument(url).promise.then(pdf => {
    container.innerHTML = '';
    const scale = 2; // render at 2x for crisp text on retina screens
    const renderPage = (pageNum) => {
      pdf.getPage(pageNum).then(page => {
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement('canvas');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        container.appendChild(canvas);
        const ctx = canvas.getContext('2d');
        page.render({ canvasContext: ctx, viewport }).promise.then(() => {
          if(pageNum < pdf.numPages) renderPage(pageNum + 1);
        });
      });
    };
    renderPage(1);
  }).catch(err => {
    console.error('PDF render failed', err);
    container.innerHTML = '<div class="pdf-loading">Could not load PDF</div>';
  });
}

/* ============================= STATS ============================= */
function computeTotals(type){
  const st = STATE[type];
  let attempts=0, correct=0;
  Object.values(st.attempts).forEach(v=>attempts+=v);
  Object.values(st.correct).forEach(v=>correct+=v);
  return { attempts, correct, accuracy: pct(correct, attempts) };
}

function weakest(type, n){
  const st = STATE[type];
  const items = BY_TYPE[type];
  const list = Object.keys(st.wrong).map(id=>({
    id, wrong: st.wrong[id], item: items.find(x=>x.id===id)
  })).filter(x=>x.item);
  list.sort((a,b)=>b.wrong-a.wrong);
  return list.slice(0,n);
}

function renderStats(){
  const wTot = computeTotals('words');
  const sTot = computeTotals('sentences');
  const combinedAttempts = wTot.attempts + sTot.attempts;
  const combinedCorrect = wTot.correct + sTot.correct;
  const overallAcc = pct(combinedCorrect, combinedAttempts);

  const wDone = WORDS.length - new Set(STATE.words.remaining).size;
  const sDone = SENTS.length - new Set(STATE.sentences.remaining).size;

  const recent = STATE.history.slice(-14);

    <div class="trend-chart">
      ${recent.map(h=>{
        const p = pct(h.score, h.total);
        return `<div class="trend-bar" style="height:${Math.max(p,4)}%" title="${h.type}: ${h.score}/${h.total}"></div>`;
      }).join('')}

  ` : `<div class="empty-block">Complete a quiz round to see your trend here.</div>`;

  const html = `

function renderProfile(){

  const points = totalPoints();

  // sort: unlocked-unclaimed first, then locked (by proximity to completion), then claimed
  const rows = BADGE_DEFS.map(b=>{
    const unlocked = STATE.badges.includes(b.id);
    const claimed = STATE.claimedBadges.includes(b.id);
    const prog = Math.max(0, Math.min(1, b.progress ? b.progress(STATE) : (unlocked?1:0)));
    return { b, unlocked, claimed, prog };
  });
  rows.sort((x,y)=>{
    const rank = r => r.unlocked && !r.claimed ? 0 : (!r.unlocked ? 1 : 2);
    const rx = rank(x), ry = rank(y);
    if(rx !== ry) return rx - ry;
    return y.prog - x.prog;

async function renderLeaderboard(){
  if(lbTab === 'matches') return renderMatches();

  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-topbar"><h1>Leaderboard</h1></div>
    ${renderLbTabs(0)}
    <div class="lb-loading">Loading rankings…</div>
  `;
  await pushLeaderboard();

  let entries = await fetchLeaderboardEntries();
  if(!entries.some(e=>e.userId === STATE.userId)){
    entries.push({ userId: STATE.userId, nickname: STATE.nickname||'Learner', avatar: STATE.avatar||'🐼', points: totalPoints(), level: levelInfo(totalPoints()).level, streak: STATE.streak.count||0 });
  }
  entries.sort((a,b)=> b.points - a.points);
  lbEntriesCache = entries;

  const myRank = entries.findIndex(e=>e.userId === STATE.userId) + 1;

  const top3 = entries.slice(0,3);
  const rest = entries.slice(3);

  const podiumOrder = top3.length === 3 ? [top3[1], top3[0], top3[2]] : top3;
  const podiumHtml = top3.length ? `
    <div class="lb-podium">
      ${podiumOrder.map(e=>{
        const rank = top3.indexOf(e) + 1;
        const isMe = e.userId === STATE.userId;
        return `
          <div class="podium-col p${rank}">
            ${rank===1 ? '<div class="podium-crown">' + ic('crown') + '</div>' : '<div class="podium-crown" style="visibility:hidden;">' + ic('crown') + '</div>'}
            <div class="podium-avatar-wrap">
              <div class="podium-avatar avatar-emoji">${esc(e.avatar||'🐼')}</div>
              <div class="podium-rank-badge">${rank}</div>
            </div>
            <div class="podium-name">${esc(e.nickname||'Learner')}${isMe?' (you)':''}</div>
            <div class="podium-pts">${ic('star','btn-ic')}${e.points}</div>
            ${!isMe ? `<button class="podium-challenge-btn" data-challenge="${esc(e.userId)}">${ic('swords','btn-ic')}Challenge</button>` : ''}
          </div>
        `;
      }).join('')}
    </div>
  ` : '';

  const listHtml = rest.length ? rest.map((e,i)=>{
    const r = i+4;
    const isMe = e.userId === STATE.userId;
    return `
      <div class="lb-row ${isMe?'me':''}">
        <div class="lb-rank">${r}</div>
        <div class="lb-avatar avatar-emoji">${esc(e.avatar || '🐼')}</div>
        <div class="lb-body">
          <div class="lb-name">${esc(e.nickname||'Learner')}${isMe ? ' (you)' : ''}</div>
          <div class="lb-sub">Lv ${e.level||1} · ${ic('flame','btn-ic')}${e.streak||0}</div>
        </div>
        <div class="lb-points">${e.points}</div>
        ${!isMe ? `<button class="challenge-btn" data-challenge="${esc(e.userId)}" title="Challenge">${ic('swords')}</button>` : ''}
      </div>
    `;
  }).join('') : (entries.length <= 1 ? `<div class="empty-block">Invite friends to see them on the leaderboard!</div>` : '');

  main.innerHTML = `
    <div class="page-topbar"><h1>Leaderboard</h1></div>
    ${renderLbTabs(0)}
    <div class="lb-me-card">
      <div class="avatar avatar-emoji">${esc(STATE.avatar || '🐼')}</div>
      <div>
        <div class="lb-me-name">${esc(STATE.nickname||'Learner')}</div>
        <div class="lb-me-sub">${totalPoints()} points · Lv ${levelInfo(totalPoints()).level}</div>

        <div class="lr-lbl">Rank</div>
      </div>
    </div>

/* ============================= MATCHES TAB ============================= */
async function renderMatches(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="page-topbar"><h1>Leaderboard</h1></div>
    ${renderLbTabs(0)}
    <div class="lb-loading">Loading matches…</div>
  `;
  wireLbTabs();

  let all = await fetchAllMatches();
  all = await settleStaleMatches(all);
  all.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));

  const roleOf = m => m.fromUserId === STATE.userId ? 'from' : 'to';

  // Needs my action: pending challenges sent TO me, or live matches I haven't finished yet.
  const toPlay = all.filter(m=>{
    const role = roleOf(m);
    if(m.status === 'pending') return role === 'to';
    if(m.status === 'active') return role==='from' ? !m.fromDone : !m.toDone;
    return false;
  });
  // Nothing for me to do right now, but not resolved yet.
  const waiting = all.filter(m=>{
    const role = roleOf(m);
    if(m.status === 'pending') return role === 'from';
    if(m.status === 'active'){ const myDone = role==='from' ? m.fromDone : m.toDone; return myDone; }
    return false;
  });
  const finished = all.filter(m=> m.status==='done' || m.status==='expired' || m.status==='declined');

  function matchRow(m){
    const role = roleOf(m);
    const oppName = role==='from' ? m.toNickname : m.fromNickname;
    const oppAvatar = role==='from' ? m.toAvatar : m.fromAvatar;
    const myDone = role==='from' ? m.fromDone : m.toDone;
    const myScore = role==='from' ? m.fromScore : m.toScore;
    const oppScore = role==='from' ? m.toScore : m.fromScore;

    let statusHtml, bottomHtml;
    if(m.status === 'done'){
      const won = m.winnerUserId === STATE.userId;
      const tie = m.winnerUserId === null;
      const cls = tie ? 'st-tie' : (won ? 'st-win' : 'st-loss');
      const label = tie ? 'Tie' : (won ? 'Won' : 'Lost');
      statusHtml = `<span class="match-status ${cls}">${label}</span>`;
      bottomHtml = `<span class="match-score-txt">You ${myScore} — ${oppScore} them</span>`;
    } else if(m.status === 'expired'){
      statusHtml = `<span class="match-status st-loss">Expired</span>`;
      bottomHtml = `<span class="match-score-txt">${role==='to' ? "You didn't accept in time." : esc(oppName)+" didn't respond in time."}</span>`;
    } else if(m.status === 'declined'){
      statusHtml = `<span class="match-status st-loss">Declined</span>`;
      bottomHtml = `<span class="match-score-txt">${role==='to' ? 'You declined this challenge.' : esc(oppName)+' declined your challenge.'}</span>`;
    } else if(m.status === 'pending'){
      if(role === 'to'){
        statusHtml = `<span class="match-status st-active">Challenge!</span>`;
        bottomHtml = `<span class="match-score-txt">Expires in ${formatDuration(m.acceptDeadline-Date.now())}</span><button class="match-play-btn" data-accept="${m.id}">Accept</button>`;
      } else {
        statusHtml = `<span class="match-status st-active">Pending</span>`;
        bottomHtml = `<span class="match-score-txt">Waiting for ${esc(oppName)} to accept — expires in ${formatDuration(m.acceptDeadline-Date.now())}</span>`;
      }
    } else { // active
      if(!myDone){
        statusHtml = `<span class="match-status st-active">Live!</span>`;
        bottomHtml = `<span class="match-score-txt">Time left: ${formatDuration(m.quizDeadline-Date.now())}</span><button class="match-play-btn" data-play="${m.id}">Play</button>`;
      } else {
        statusHtml = `<span class="match-status st-active">Waiting</span>`;
        bottomHtml = `<span class="match-score-txt">You scored ${myScore}/${m.itemIds.length} — ${formatDuration(m.quizDeadline-Date.now())} left for ${esc(oppName)}</span>`;
      }
    }

    return `
      <div class="match-card" ${m.status==='done' ? `data-result="${m.id}" style="cursor:pointer"` : ''}>
        <div class="match-top">
          <div class="match-vs-row">
            <div class="match-avatar avatar-emoji">${esc(oppAvatar||'🐼')}</div>
            <div class="match-name">${esc(oppName||'Learner')}</div>
          </div>
          ${statusHtml}
        </div>
        <div class="match-bottom">${bottomHtml}</div>
      </div>
    `;
  }

  let bodyHtml = '';
  if(toPlay.length){
    bodyHtml += `<div class="match-section-title">Your Turn</div>` + toPlay.map(matchRow).join('');
  }
  if(waiting.length){
    bodyHtml += `<div class="match-section-title">Waiting</div>` + waiting.map(matchRow).join('');
  }
  if(finished.length){
    bodyHtml += `<div class="match-section-title">Finished</div>` + finished.map(matchRow).join('');
  }
  if(!bodyHtml){
    bodyHtml = `<div class="match-empty">No matches yet.<br>Challenge someone from the Ranking tab! ${ic('swords')}</div>`;
  }

  main.innerHTML = `
    <div class="page-topbar"><h1>Leaderboard</h1></div>
    ${renderLbTabs(toPlay.length)}
    ${bodyHtml}
  `;
  wireLbTabs();
  document.querySelectorAll('[data-result]').forEach(card=>{
    card.onclick = ()=>{
      const m = all.find(x=>x.id === card.getAttribute('data-result'));
      if(m) renderMatchResult(m, roleOf(m));
    };
  });
  document.querySelectorAll('[data-accept]').forEach(btn=>{
    btn.onclick = ()=>{
      const m = all.find(x=>x.id === btn.getAttribute('data-accept'));
      if(m) openAcceptMatchModal(m);
    };
  });
  document.querySelectorAll('[data-play]').forEach(btn=>{
    btn.onclick = ()=>{
      const m = all.find(x=>x.id === btn.getAttribute('data-play'));
      if(m) launchMatchQuiz(m, roleOf(m));
    };
  });

  // If the opponent accepted my challenge while I was away, greet me with the live match now.
  const justWentLive = all.find(m=>{
    const role = roleOf(m);
    if(m.status !== 'active') return false;
    const myDone = role==='from' ? m.fromDone : m.toDone;
    const myNotified = role==='from' ? m.fromNotified : m.toNotified;
    return !myDone && !myNotified;
  });
  if(justWentLive) openMatchStartedModal(justWentLive, roleOf(justWentLive));
}

function buildAvatarGridHtml(selected){
  return AVATAR_OPTIONS.map(a=>`
    <button type="button" class="avatar-opt ${a===selected?'selected':''}" data-avatar="${a}">${a}</button>
  `).join('');
}
function wireAvatarGrid(container, onChange){
  let current = container.querySelector('.avatar-opt.selected');
  container.querySelectorAll('.avatar-opt').forEach(btn=>{

      container.querySelectorAll('.avatar-opt').forEach(b=>b.classList.remove('selected'));

      onChange(btn.getAttribute('data-avatar'));
    };
  });
}

  root.innerHTML = `

  `;

  document.getElementById('onboardSkip').onclick = ()=> finishOnboarding();

    else { onboardIndex++; renderWelcomeScreen(); }
  };
  root.querySelectorAll('[data-dot]').forEach(dot=>{
    dot.onclick = ()=>{ onboardIndex = parseInt(dot.getAttribute('data-dot'),10); renderWelcomeScreen(); };
  });

  // basic swipe support
  const hero = document.getElementById('onboardHero');
  let touchX = null;
  hero.addEventListener('touchstart', (e)=>{ touchX = e.touches[0].clientX; }, {passive:true});
  hero.addEventListener('touchend', (e)=>{
    if(touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if(dx < -40 && onboardIndex < ONBOARD_SLIDES.length-1){ onboardIndex++; renderWelcomeScreen(); }
    else if(dx > 40 && onboardIndex > 0){ onboardIndex--; renderWelcomeScreen(); }
    touchX = null;
  }, {passive:true});

function renderVerifyScreen(email, opts){
  opts = opts || {};
  const root = document.getElementById('authRoot');
  if(!root) return;
  root.innerHTML = `
    <div class="auth-screen">
      <div class="auth-hero">
        ${authHeroDecor()}
        <div class="auth-hero-top">
          <span></span>
          <span></span>

          <div class="onboard-icon">${ic('mail')}</div>
        </div>
        <h1 class="auth-hero-title" style="text-align:center;">Verify your<br>email</h1>
      </div>
      <div class="auth-body">
        <p class="verify-text">We've sent a verification link to<br><b>${esc(email||'')}</b>. Open it, then come back here.</p>
        <div class="auth-error" id="authError" style="text-align:center;"></div>
        <div class="verify-msg" id="verifyMsg"></div>
        <button class="auth-submit-btn" id="verifyContinueBtn">I've verified — Continue</button>
        <button class="auth-social-btn" id="verifyResendBtn" style="width:100%; margin-top:12px;">Resend email</button>
        <div class="auth-bottom-link" style="margin-top:22px;">Wrong email? <a id="verifyBackBtn">Back to Sign in</a></div>
      </div>
    </div>
  `;

  const errBox = document.getElementById('authError');
  const msgBox = document.getElementById('verifyMsg');
  const continueBtn = document.getElementById('verifyContinueBtn');
  const resendBtn = document.getElementById('verifyResendBtn');
  const backBtn = document.getElementById('verifyBackBtn');

  continueBtn.onclick = async ()=>{
    errBox.textContent = ''; msgBox.textContent = '';
    if(!fbAuth || !fbAuth.currentUser){ authBanner=''; renderAuthScreen('signin'); return; }
    continueBtn.disabled = true; continueBtn.textContent = 'Checking…';
    try{
      await fbAuth.currentUser.reload();
      if(fbAuth.currentUser.emailVerified){
        await fbAuth.signOut();
        authBanner = 'Email verified! Please sign in to continue.';
        renderAuthScreen('signin');
        return;
      } else {
        errBox.textContent = 'Still not verified. Please open the link in the email we sent (check spam too).';
      }
    }catch(err){ errBox.textContent = authFriendlyError(err); }
    continueBtn.disabled = false; continueBtn.textContent = "I've verified — Continue";
  };

  resendBtn.onclick = async ()=>{
    if(!fbAuth || !fbAuth.currentUser){ return; }
    resendBtn.disabled = true;
    try{
      await fbAuth.currentUser.sendEmailVerification();
      msgBox.textContent = 'Verification email resent!';
    }catch(err){ errBox.textContent = authFriendlyError(err); }
    setTimeout(()=>{ resendBtn.disabled = false; }, 20000);
  };

  backBtn.onclick = async ()=>{
    if(fbAuth && fbAuth.currentUser){ try{ await fbAuth.signOut(); }catch(e){} }
    authBanner = '';
    renderAuthScreen('signin');
  };
}

function authFriendlyError(err){
  const code = err && err.code || '';
  const map = {
    'auth/invalid-email': 'That email address looks invalid.',
    'auth/user-not-found': 'No account found with that email.',
    'auth/wrong-password': 'Incorrect password. Please try again.',
    'auth/invalid-credential': 'Incorrect email or password.',
    'auth/email-already-in-use': 'An account with that email already exists.',
    'auth/weak-password': 'Password should be at least 6 characters.',
    'auth/popup-closed-by-user': 'Sign-in was cancelled.',
    'auth/operation-not-allowed': 'This sign-in method isn\'t enabled yet.',
    'auth/network-request-failed': 'Network error. Please check your connection.',
    'auth/too-many-requests': 'Too many attempts. Please wait a bit and try again.'
  };
  return map[code] || (err && err.message) || 'Something went wrong. Please try again.';
}

function wireAuthScreen(){
  const form = document.getElementById('authForm');
  const errBox = document.getElementById('authError');
  const submitBtn = document.getElementById('authSubmitBtn');
  const topToggle = document.getElementById('authTopToggle');
  const bottomToggle = document.getElementById('authBottomToggle');
  const backBtn = document.getElementById('authBackBtn');
  const eyeBtn = document.getElementById('authEye');
  const googleBtn = document.getElementById('authGoogleBtn');
  const appleBtn = document.getElementById('authAppleBtn');

  const goToggleMode = ()=>{ authBanner=''; renderAuthScreen(authMode === 'signin' ? 'signup' : 'signin'); };
  if(topToggle) topToggle.onclick = goToggleMode;
  if(bottomToggle) bottomToggle.onclick = goToggleMode;
  if(backBtn) backBtn.onclick = ()=>{
    authBanner='';
    if(authMode === 'signup') renderAuthScreen('signin');
    else renderWelcomeScreen();
  };

  if(eyeBtn){
    eyeBtn.onclick = ()=>{
      const pw = document.getElementById('authPassword');
      pw.type = pw.type === 'password' ? 'text' : 'password';
      eyeBtn.innerHTML = pw.type === 'password' ? EYE_ON : EYE_OFF;
    };
  }

  function setBusy(busy, label){
    submitBtn.disabled = busy;
    submitBtn.textContent = busy ? 'Please wait…' : label;
  }
  function showError(msg){ errBox.textContent = msg || ''; }

  form.onsubmit = async (e)=>{
    e.preventDefault();
    showError('');
    if(!fbAuth){ showError('Sign-in isn\'t available right now. Please try again shortly.'); return; }
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;

    if(authMode === 'signin'){
      if(!email || !password){ showError('Please enter your email and password.'); return; }
      setBusy(true, 'Sign in');
      try{
        const cred = await fbAuth.signInWithEmailAndPassword(email, password);
        if(cred.user && !cred.user.emailVerified){
          pendingVerifyEmail = email;
          renderVerifyScreen(email);
          return;
        }
      }catch(err){ showError(authFriendlyError(err)); setBusy(false, 'Sign in'); }
    } else {
      const name = document.getElementById('authName').value.trim();
      const password2 = document.getElementById('authPassword2').value;
      if(!name || name.length < 2){ showError('Please enter your full name.'); return; }
      if(!email || !password){ showError('Please enter an email and password.'); return; }
      if(password.length < 6){ showError('Password should be at least 6 characters.'); return; }
      if(password !== password2){ showError('Passwords don\'t match.'); return; }
      setBusy(true, 'Register');
      try{
        if(!fbAuth){ showError('Sign-up isn\'t available right now. Please try again shortly.'); setBusy(false, 'Register'); return; }
        const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
        try{ await cred.user.updateProfile({ displayName: name }); }catch(e){}
        try{ await cred.user.sendEmailVerification(); }catch(e){}
        pendingVerifyEmail = email;
        renderVerifyScreen(email);
        return;
      }catch(err){ showError(authFriendlyError(err)); setBusy(false, 'Register'); }
    }
  };

  if(googleBtn){
    googleBtn.onclick = async ()=>{
      if(!fbAuth){ showError('Sign-in isn\'t available right now.'); return; }
      showError('');
      try{
        const provider = new firebase.auth.GoogleAuthProvider();
        await fbAuth.signInWithPopup(provider);
      }catch(err){ showError(authFriendlyError(err)); }
    };
  }
  if(appleBtn){
    appleBtn.onclick = async ()=>{
      if(!fbAuth){ showError('Sign-in isn\'t available right now.'); return; }
      showError('');
      try{
        const provider = new firebase.auth.OAuthProvider('apple.com');
        await fbAuth.signInWithPopup(provider);
      }catch(err){ showError(authFriendlyError(err)); }
    };
  }
}

async function initAuthGate(){
  const loadingEl = document.getElementById('authLoading');
  const appEl = document.querySelector('.app');
  if(!fbAuth){
    // Firebase unavailable — fail open so the app still works offline.
    console.warn('Firebase Auth unavailable; skipping sign-in gate.');
    if(loadingEl) loadingEl.remove();
    appEl.classList.remove('app-hidden');
    startApp();
    return;
  }
  fbAuth.onAuthStateChanged(async (user)=>{
    if(loadingEl) loadingEl.remove();
    const root = document.getElementById('authRoot');
    if(user && user.emailVerified){
      if(appStarted && startedUid !== user.uid){ appStarted = false; STATE = null; }  // different account -> reload its own data
      root.innerHTML = '';
      appEl.classList.remove('app-hidden');
      startApp();
    } else if(user && !user.emailVerified){
      appEl.classList.add('app-hidden');
      appStarted = false;
      renderVerifyScreen(user.email);
    } else {
      appEl.classList.add('app-hidden');
      appStarted = false; STATE = null; startedUid = null;
      await showLoggedOutScreen();
    }
  });
}

/* ============================= WRITING PRACTICE ============================= */
const WORD_INDEX = {}; WORDS.forEach((w,i)=>{ WORD_INDEX[w.id] = i; });
function writtenKey(){ const u = authUser(); return u ? 'hsk4_written_' + u.uid : 'hsk4_written'; }
function loadWritten(){ try{ return new Set(JSON.parse(localStorage.getItem(writtenKey())||'[]')); }catch(e){ return new Set(); } }
function saveWritten(){ try{ localStorage.setItem(writtenKey(), JSON.stringify([...writeState.done])); }catch(e){} }
const writeState = { idx:0, mode:'trace', done:loadWritten(), writers:[], finished:0, total:0, token:0 };

function openWrite(wordId){
  if(wordId && WORD_INDEX[wordId] !== undefined) writeState.idx = WORD_INDEX[wordId];
  navigate('write');
}

function writeCleanup(){
  writeState.token++;
  writeState.writers.forEach(w=>{ try{ w.cancelQuiz(); }catch(e){} });
  writeState.writers = [];
}

        <button class="wr-btn" id="wrReset">${ic('rotate-ccw','btn-ic')}Restart</button>

      if(!writeState.done.has(WORDS[j].id)){ writeState.idx = j; break; }

function setupWriters(chars){
  const hint = document.getElementById('wrHint');
  const hintText = {
    watch: 'Watch how each character is written, stroke by stroke. Tap "Show me" to replay.',
    trace: 'Trace each stroke on the outline in the correct order. A hint appears if you miss twice.',
    write: 'Write each character from memory, stroke by stroke. A hint appears after three misses.'
  };
  hint.textContent = hintText[writeState.mode];
  if(typeof HanziWriter === 'undefined'){
    hint.innerHTML = ic('alert','btn-ic') + 'The stroke-order library could not load. Please check your internet connection and reopen this page.';
    return;
  }
  const token = writeState.token;
  const size = Math.max(110, Math.min(170, Math.floor((Math.min(window.innerWidth, 480) - 40 - 32 - 16) / 2)));
  writeState.total = chars.length; writeState.finished = 0;
  chars.forEach((c,i)=>{
    const box = document.getElementById('wrBox'+i);
    box.style.width = box.style.height = size + 'px';
    const writer = HanziWriter.create(box, c, {
      width: size - 4, height: size - 4, padding: 10,
      showOutline: writeState.mode === 'trace',
      showCharacter: writeState.mode === 'watch',
      strokeAnimationSpeed: 1.1, delayBetweenStrokes: 250,
      strokeColor: '#3B1E8C', radicalColor: '#C23E7A', outlineColor: '#D7CFF2',
      highlightColor: '#28A15C', drawingColor: '#5B34B0', drawingWidth: 8,
      onLoadCharDataError: ()=>{
        box.insertAdjacentHTML('beforeend', '<div class="wr-err">Could not load strokes. Check your connection.</div>');
      }
    });
    writeState.writers.push(writer);
    HanziWriter.loadCharacterData(c).then(d=>{
      if(token !== writeState.token) return;
      const el = document.getElementById('wrInfo'+i);
      if(el && d) el.textContent = c + ' · ' + d.strokes.length + ' strokes';
    }).catch(()=>{});
    if(writeState.mode === 'watch'){
      setTimeout(()=>{ if(token === writeState.token) { try{ writer.animateCharacter(); }catch(e){} } }, 300 + i*200);
    } else {
      writer.quiz({
        leniency: 1.2,
        showHintAfterMisses: writeState.mode === 'trace' ? 2 : 3,
        highlightOnComplete: true,
        onMistake: ()=>{ try{ playWrongSound(); }catch(e){} },
        onCorrectStroke: ()=>{ try{ playCorrectSound(); }catch(e){} },
        onComplete: ()=>{
          if(token !== writeState.token) return;
          box.classList.add('ok');
          writeState.finished++;
          if(writeState.finished >= writeState.total) writeFinished();
        }
      });
    }
  });
}

function writeFinished(){
  const w = WORDS[writeState.idx];
  writeState.done.add(w.id); saveWritten();
  const b = document.getElementById('wrBanner'); if(b) b.classList.add('show');
  const s = document.getElementById('wrStatus'); if(s){ s.innerHTML = ic('check','btn-ic') + 'Written'; s.classList.add('done'); }
  try{ playCelebrationSound(); }catch(e){}
  try{ speak(w.hanzi); }catch(e){}
}

function writeDemo(){
  if(typeof HanziWriter === 'undefined') return;
  const token = writeState.token;
  const ws = writeState.writers;
  let i = 0;
  const next = ()=>{
    if(token !== writeState.token || i >= ws.length) return;
    const wr = ws[i++];
    try{ wr.cancelQuiz(); }catch(e){}
    wr.showCharacter();
    wr.animateCharacter({ onComplete: next });
  };
  next();
}

/* ============================= PICK 10 WORDS QUIZ ============================= */
const pickState = { q:'', shown:60 };
// The selection screen is shared: "My 10" quiz (10 words) and match challenges (20 words).
function quizPickCfg(){ return { max:10, key:'customSet', title:'My 10-Word Quiz', back:'home', startLabel:'Start Quiz →', note:'', onStart: (ids)=> startCustomQuiz(ids) }; }
let pickCfg = quizPickCfg();
function customSel(){ if(!Array.isArray(STATE[pickCfg.key])) STATE[pickCfg.key] = []; return STATE[pickCfg.key]; }
function openPick(){ pickCfg = quizPickCfg(); pickState.q = ''; pickState.shown = 60; navigate('pick'); }
function openMatchPick(opponent){
  pickCfg = {
    max:20, key:'matchSet', title:'Pick 20 Words', back:'leaderboard', startLabel:'Send Challenge →',
    note:'You and ' + (opponent.nickname || 'your opponent') + ' will both play a match using only these 20 words.',
    onStart: async (ids)=>{
      await createChallenge(opponent, ids);
      STATE.matchSet = []; saveState();
      lbTab = 'matches';
      navigate('leaderboard', true);
    }
  };
  pickState.q = ''; pickState.shown = 60; navigate('pick');
}

function renderPick(){
  document.getElementById('main').innerHTML = `
    <div class="page-topbar">
      <button class="icon-btn" id="pkBack"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <h1>${esc(pickCfg.title)}</h1>
      <div></div>
    </div>
    ${pickCfg.note ? `<div class="wr-hint" style="margin:-4px 0 10px;">${esc(pickCfg.note)}</div>` : ''}
    <div class="pk-sum">
      <div class="pk-top"><div class="pk-count" id="pkCount"></div><div style="font-size:12px;color:var(--ink-soft);">Tap a chip to remove</div></div>
      <div class="pk-tray" id="pkTray"></div>
      <div class="pk-row-btns">
        <button class="wr-btn" id="pkRandom">${ic('dice','btn-ic')}Fill randomly</button>
        <button class="wr-btn" id="pkClear">Clear</button>
      </div>
      <button class="wr-btn main" id="pkStart" style="width:100%;">Start Quiz</button>
      <div class="pk-toast" id="pkToast"></div>
    </div>
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="pkSearch" placeholder="Search hanzi, pinyin or meaning" autocomplete="off">
    </div>
    <div class="pk-list" id="pkList"></div>
    <div id="pkMoreWrap"></div>
  `;
  document.getElementById('pkBack').onclick = ()=> navigate(pickCfg.back);
  document.getElementById('pkSearch').oninput = (e)=>{ pickState.q = e.target.value.trim(); pickState.shown = 60; renderPickList(); };
  document.getElementById('pkClear').onclick = ()=>{ STATE[pickCfg.key] = []; saveState(); renderPickList(); updatePickSummary(); };
  document.getElementById('pkRandom').onclick = ()=>{
    const sel = customSel();
    const pool = shuffle(WORDS.filter(w=>!sel.includes(w.id)));
    while(sel.length < pickCfg.max && pool.length) sel.push(pool.pop().id);
    saveState(); renderPickList(); updatePickSummary();
  };
  document.getElementById('pkStart').onclick = ()=>{
    const sel = customSel();
    if(sel.length !== pickCfg.max){ pickToast('Pick exactly ' + pickCfg.max + ' words to start (' + sel.length + ' selected).'); return; }
    pickCfg.onStart(sel.slice());
  };
  renderPickList(); updatePickSummary();
}

function pickToast(msg){ const t = document.getElementById('pkToast'); if(t){ t.textContent = msg; clearTimeout(pickToast._t); pickToast._t = setTimeout(()=>{ t.textContent=''; }, 2500); } }

function updatePickSummary(){
  const sel = customSel();
  const byId = {}; WORDS.forEach(w=>{ byId[w.id] = w; });
  document.getElementById('pkCount').textContent = sel.length + ' / ' + pickCfg.max + ' selected';
  const tray = document.getElementById('pkTray');
  tray.innerHTML = sel.length ? sel.map(id=>`<button class="pk-chip hanzi" data-id="${id}">${esc(byId[id].hanzi)} ${ic('x')}</button>`).join('') : '<span class="pk-empty">No words picked yet. Tap words below.</span>';
  tray.querySelectorAll('.pk-chip').forEach(b=> b.onclick = ()=>{ STATE[pickCfg.key] = customSel().filter(x=>x!==b.dataset.id); saveState(); renderPickList(); updatePickSummary(); });
  const st = document.getElementById('pkStart');
  st.textContent = sel.length === pickCfg.max ? pickCfg.startLabel : 'Pick ' + (pickCfg.max - sel.length) + ' more';
  st.style.opacity = sel.length === pickCfg.max ? '1' : '.6';
}

function renderPickList(){
  const sel = customSel();
  const list = filterEntries('words', pickState.q);
  const shown = list.slice(0, pickState.shown);
  const el = document.getElementById('pkList');
  el.innerHTML = shown.length ? shown.map(w=>`
    <button class="pk-item ${sel.includes(w.id)?'on':''}" data-id="${w.id}">
      <span class="pk-box">${sel.includes(w.id)?ic('check'):''}</span>
      <span class="pk-h hanzi">${esc(w.hanzi)}</span>
      <span class="pk-m"><div class="p">${esc(w.pinyin)}</div><div class="e">${esc(w.answer)}</div></span>
    </button>`).join('') : '<div class="empty-block" style="margin:14px;">No words match your search.</div>';
  el.querySelectorAll('.pk-item').forEach(b=> b.onclick = ()=>{
    const id = b.dataset.id, cur = customSel();
    if(cur.includes(id)){ STATE[pickCfg.key] = cur.filter(x=>x!==id); }
    else if(cur.length >= pickCfg.max){ pickToast('You already picked ' + pickCfg.max + '. Remove one first.'); return; }
    else { cur.push(id); }
    saveState();
    const on = customSel().includes(id);
    b.classList.toggle('on', on); b.querySelector('.pk-box').innerHTML = on ? ic('check') : '';
    updatePickSummary();
  });
  const more = document.getElementById('pkMoreWrap');
  more.innerHTML = list.length > shown.length ? `<button class="wr-btn" id="pkMore" style="width:100%;margin-bottom:14px;">Show more (${list.length - shown.length} left)</button>` : '';
  const mb = document.getElementById('pkMore'); if(mb) mb.onclick = ()=>{ pickState.shown += 80; renderPickList(); };
}

function startCustomQuiz(ids, setIds){
  quizCtx = {
    type: 'words', ids: shuffle(ids.slice()), idx: 0, score: 0, perQuestionResult: [],
    answered: false, combo: 0, maxCombo: 0, bonusEarned: 0,
    custom: true, setIds: (setIds || ids).slice()
  };
  saveState();
  navigate('quiz', true);
}

/* ============================= SHOW / HIDE PINYIN IN QUIZZES ============================= */
const EYE_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5.6 19 2 12 2 12a18.7 18.7 0 0 1 4.1-5.1M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18.6 18.6 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>';
function pyHidden(){ try{ return localStorage.getItem('hsk4_hide_pinyin') === '1'; }catch(e){ return false; } }
function pyEyeBtn(){ const h = pyHidden(); return `<button class="q-eye" type="button" title="${h?'Show pinyin':'Hide pinyin'}" aria-label="${h?'Show pinyin':'Hide pinyin'}">${h?EYE_OFF:EYE_ON}</button>`; }
document.addEventListener('click', (e)=>{
  const b = e.target.closest && e.target.closest('.q-eye');
  if(!b) return;
  const hide = !pyHidden();
  try{ localStorage.setItem('hsk4_hide_pinyin', hide ? '1' : '0'); }catch(_){}
  const py = document.getElementById('qPinyin'); if(py) py.classList.toggle('py-hidden', hide);
  b.innerHTML = hide ? EYE_OFF : EYE_ON;
  b.title = b.ariaLabel = hide ? 'Show pinyin' : 'Hide pinyin';
});

initAuthGate();
