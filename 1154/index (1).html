<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>HSK 4 Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EFECFB;
    --purple:#3B1E8C;
    --purple-dark:#28136B;
    --purple-mid:#5B34B0;
    --lavender:#EFE8FD;
    --lavender-deep:#E3D8FB;
    --pink:#F7E4EE;
    --pink-ink:#C23E7A;
    --ink:#1E1A33;
    --ink-soft:#8A84A6;
    --ink-faint:#B4AFC9;
    --white:#FFFFFF;
    --green-bg:#DFF3E6;
    --green-ink:#28A15C;
    --orange-bg:#FDECD3;
    --orange-ink:#DB8B26;
    --red-bg:#FBE0E4;
    --red-ink:#DA3E5C;
    --shadow-card: 0 10px 26px rgba(59,30,140,0.08);
    --shadow-btn: 0 10px 22px rgba(59,30,140,0.28);
    --radius-lg:22px;
    --radius-md:16px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease;
  }
  body.on-results{ background:linear-gradient(160deg, #3B1E8C 0%, #2A1266 60%, #1C0B4A 100%); }
  .hanzi{font-family:'Noto Sans SC','Inter',sans-serif;}
  h1,h2,h3,.display{font-family:'Poppins',sans-serif;}
  button{font-family:inherit;}
  .app{position:relative; max-width:460px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}
  main{flex:1; padding:18px 18px 100px;}

  /* ---------------- Bottom Nav ---------------- */
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0.32));
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border-top:1px solid rgba(255,255,255,0.55);
    box-shadow:0 -8px 32px rgba(59,30,140,0.18);
    display:flex; align-items:center; justify-content:space-evenly;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    z-index:20;
  }
  .nav-item{
    background:rgba(255,255,255,0.001); border:none; cursor:pointer;
    flex:1; max-width:64px; height:48px; border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    transition:background .15s ease, color .15s ease, transform .12s ease;
  }
  .nav-item:active{ transform:scale(0.92); }
  .nav-item svg{width:22px; height:22px;}
  .nav-item.active{
    background:linear-gradient(135deg, var(--purple-mid), var(--purple));
    color:#fff;
    box-shadow:0 6px 16px rgba(59,30,140,0.35);
  }

  /* ---------------- Home header ---------------- */
  .home-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .home-user{ display:flex; align-items:center; gap:10px; }
  .avatar{
    width:44px; height:44px; border-radius:50%;
    background:linear-gradient(135deg, var(--purple-mid), var(--purple));
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:17px;
    flex-shrink:0;
  }
  .home-user .greet-title{ font-weight:700; font-size:15px; color:var(--ink); }
  .home-user .greet-sub{ font-size:12px; color:var(--ink-soft); margin-top:1px;}
  .points-pill{
    display:flex; align-items:center; gap:6px;
    background:var(--pink); color:var(--pink-ink);
    border-radius:999px; padding:8px 13px;
    font-weight:700; font-size:13px;
  }
  .points-pill svg{width:15px; height:15px;}

  .search-bar{
    display:flex; align-items:center; gap:10px;
    background:var(--white); border-radius:16px; padding:13px 16px;
    box-shadow:var(--shadow-card); margin-bottom:20px;
  }
  .search-bar svg{width:17px; height:17px; color:var(--ink-faint); flex-shrink:0;}
  .search-bar input{
    border:none; outline:none; background:none; flex:1;
    font-family:'Inter',sans-serif; font-size:14px; color:var(--ink);
  }
  .search-bar input::placeholder{ color:var(--ink-faint); }

  /* ---------------- Banner ---------------- */
  .banner{
    background:linear-gradient(135deg, #4A24A0 0%, #2C1266 100%);
    border-radius:var(--radius-lg);
    padding:22px 20px;
    position:relative; overflow:hidden;
    margin-bottom:22px;
    box-shadow:var(--shadow-btn);
  }
  .banner::after{
    content:""; position:absolute; right:-30px; top:-30px; width:140px; height:140px;
    border-radius:50%; background:rgba(255,255,255,0.08);
  }
  .banner::before{
    content:""; position:absolute; right:20px; bottom:-40px; width:90px; height:90px;
    border-radius:50%; background:rgba(255,255,255,0.06);
  }
  .banner h2{ color:#fff; font-size:19px; margin:0 0 4px; position:relative; z-index:1;}
  .banner p{ color:rgba(255,255,255,0.75); font-size:12.5px; margin:0 0 16px; position:relative; z-index:1;}
  .banner-btn{
    background:#fff; color:var(--purple); border:none; border-radius:12px;
    padding:10px 18px; font-weight:700; font-size:13px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; position:relative; z-index:1;
  }
  .banner-btn:active{ transform:scale(0.97); }

  /* ---------------- Culture glass cards ---------------- */
  .culture-scroll{
    display:flex; gap:12px; overflow-x:auto; padding:2px 2px 14px;
    margin:0 -2px 8px; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .culture-scroll::-webkit-scrollbar{ display:none; }
  .culture-card{
    position:relative; flex:0 0 auto; width:176px; height:218px;
    border-radius:20px; overflow:hidden; scroll-snap-align:start;
    background-size:cover; background-position:center; background-color:#3B1E8C;
    box-shadow:0 12px 26px rgba(59,30,140,0.22);
    isolation:isolate;
  }
  .culture-card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,10,50,0) 32%, rgba(15,7,35,0.65) 68%, rgba(8,4,20,0.92) 100%);
  }
  .culture-card .cc-glass{
    position:absolute; left:0; right:0; bottom:0; margin:0; padding:11px 13px 12px;
  }
  .culture-card .cc-title{ color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; line-height:1.2; text-shadow:0 1px 6px rgba(0,0,0,0.35); }
  .culture-card .cc-sub{ color:rgba(255,255,255,0.88); font-size:10.5px; margin-top:2px; text-shadow:0 1px 4px rgba(0,0,0,0.3); }

  /* ---------------- Video card ---------------- */
  .video-card{
    border-radius:var(--radius-lg); overflow:hidden; margin-bottom:22px;
    background:rgba(255,255,255,0.5);
    backdrop-filter:blur(14px) saturate(160%);
    -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,0.6);
    box-shadow:var(--shadow-card);
  }
  .video-card .video-frame-wrap{ position:relative; width:100%; padding-top:56.25%; background:#000; }
  .video-card .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }
  .video-card .video-frame-wrap a.video-thumb-link{ position:absolute; inset:0; display:block; text-decoration:none; }
  .video-card .video-frame-wrap a.video-thumb-link img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .video-card .video-frame-wrap a.video-thumb-link .play-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:56px; height:56px; border-radius:50%;
    background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .video-card .video-frame-wrap a.video-thumb-link:hover .play-btn{ background:rgba(0,0,0,0.8); }
  .video-card .video-frame-wrap a.video-thumb-link .play-btn::after{
    content:''; margin-left:4px; border-style:solid; border-width:10px 0 10px 16px;
    border-color:transparent transparent transparent #fff;
  }
  .video-card .video-caption{ padding:12px 15px 14px; }
  .video-card .video-caption .vt{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); }
  .video-card .video-caption .vs{ font-size:11.5px; color:var(--ink-soft); margin-top:2px; }

  /* ---------------- Section heads ---------------- */
  .section-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .section-head h3{ font-size:15px; margin:0; color:var(--ink); }
  .see-all{ background:none; border:none; color:var(--purple); font-weight:600; font-size:12.5px; cursor:pointer; }

  /* ---------------- Categories ---------------- */
  .cat-row{ display:flex; gap:12px; margin-bottom:24px; }
  .cat-tile{
    flex:1; background:var(--white); border:none; border-radius:16px;
    padding:14px 8px 12px; text-align:center; cursor:pointer;
    box-shadow:var(--shadow-card);
  }
  .cat-tile:active{ transform:scale(0.97); }
  .cat-icon{
    width:44px; height:44px; border-radius:12px; margin:0 auto 8px;
    display:flex; align-items:center; justify-content:center; font-size:19px;
  }
  .cat-tile .cat-label{ font-size:12px; font-weight:600; color:var(--ink); }

  /* ---------------- Resources ---------------- */
  .resource-list{ display:flex; flex-direction:column; gap:14px; margin-bottom:8px; }
  .resource-card{
    display:flex; align-items:center; gap:14px;
    background:var(--white); border-radius:18px; padding:16px;
    box-shadow:var(--shadow-card); text-decoration:none; cursor:pointer;
    border:none; text-align:left; width:100%; transition:transform .12s ease;
  }
  .resource-card:active{ transform:scale(0.98); }
  .resource-icon{
    width:52px; height:52px; border-radius:14px; flex-shrink:0;
    background:linear-gradient(135deg, var(--purple-mid), var(--purple));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 18px rgba(59,30,140,0.28);
  }
  .resource-icon svg{ width:24px; height:24px; color:#fff; }
  .resource-body{ flex:1; min-width:0; }
  .resource-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:14px; color:var(--ink); }
  .resource-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .resource-tag{
    display:inline-block; margin-top:6px; font-size:10px; font-weight:700;
    letter-spacing:.03em; color:var(--pink-ink); background:var(--pink);
    border-radius:999px; padding:3px 9px;
  }
  .resource-arrow{
    width:30px; height:30px; border-radius:10px; flex-shrink:0;
    background:var(--lavender); color:var(--purple);
    display:flex; align-items:center; justify-content:center;
  }
  .resource-arrow svg{ width:14px; height:14px; }
  .resources-intro{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.5; }

  /* ---------------- HSK1 Exams ---------------- */
  .exam-scroll{
    display:flex; gap:12px; overflow-x:auto; padding:2px 2px 14px;
    margin:0 -2px 8px; scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
  }
  .exam-scroll::-webkit-scrollbar{ display:none; }
  .exam-card{
    position:relative; flex:0 0 auto; width:150px; height:200px;
    border-radius:18px; overflow:hidden; scroll-snap-align:start;
    background-size:cover; background-position:center; background-color:#3B1E8C;
    box-shadow:0 12px 26px rgba(59,30,140,0.22); border:none; padding:0;
    text-align:left; cursor:pointer; isolation:isolate;
  }
  .exam-card:active{ transform:scale(0.97); }
  .exam-card::before{
    content:""; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,10,50,0) 30%, rgba(15,7,35,0.72) 64%, rgba(8,4,20,0.94) 100%);
  }
  .exam-card .ec-body{ position:absolute; left:0; right:0; bottom:0; margin:0; padding:12px 13px 13px; }
  .exam-card .ec-level{ color:rgba(255,255,255,0.85); font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .exam-card .ec-code{ color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:12.5px; margin-top:3px; text-shadow:0 1px 6px rgba(0,0,0,0.35); }
  .exam-card .ec-title{ color:rgba(255,255,255,0.92); font-size:11px; margin-top:3px; line-height:1.25; text-shadow:0 1px 4px rgba(0,0,0,0.3); }

  /* ---------------- Exam Detail page ---------------- */
  .exam-hero{
    position:relative; border-radius:20px; overflow:hidden; height:150px;
    background-size:cover; background-position:center; background-color:#3B1E8C;
    margin-bottom:18px; box-shadow:var(--shadow-card); isolation:isolate;
  }
  .exam-hero::before{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,10,50,0.05) 20%, rgba(8,4,20,0.88) 100%); }
  .exam-hero .eh-body{ position:absolute; left:0; right:0; bottom:0; padding:14px 16px; }
  .exam-hero .eh-level{ color:rgba(255,255,255,0.85); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
  .exam-hero .eh-code{ color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:16px; margin-top:2px; }
  .exam-hero .eh-title{ color:rgba(255,255,255,0.92); font-size:12.5px; margin-top:2px; }

  .exam-block{ background:var(--white); border-radius:18px; padding:16px; box-shadow:var(--shadow-card); margin-bottom:16px; }
  .exam-block-title{ font-family:'Poppins',sans-serif; font-weight:700; font-size:13.5px; color:var(--ink); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .exam-block-title svg{ width:16px; height:16px; color:var(--purple); flex-shrink:0; }

  .audio-placeholder, .pdf-placeholder{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:var(--lavender); border-radius:14px; padding:20px; text-align:center;
  }
  .audio-placeholder svg, .pdf-placeholder svg{ width:26px; height:26px; color:var(--purple); }
  .audio-placeholder .ph-text, .pdf-placeholder .ph-text{ font-size:12px; color:var(--ink-soft); }
  .pdf-placeholder{ min-height:220px; }
  .pdf-frame{ width:100%; height:360px; border:0; border-radius:14px; display:block; background:#fff; }
  .pdf-scroll{ width:100%; overflow:auto; border-radius:14px; background:#f4f4f6; -webkit-overflow-scrolling:touch; }
  .pdf-viewer{ width:100%; border-radius:14px; background:#f4f4f6; transition:width .15s ease; }
  .pdf-viewer canvas{ width:100%; height:auto; display:block; }
  .pdf-viewer canvas + canvas{ margin-top:8px; }
  .pdf-scroll.answer-frame{ margin:0; }
  .pdf-viewer .pdf-loading{ display:flex; align-items:center; justify-content:center; min-height:220px; color:var(--ink-soft); font-size:13px; }
  .pdf-zoom-row{ display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-bottom:8px; }
  .pdf-zoom-btn{ width:30px; height:30px; border-radius:50%; border:1px solid #E4E1EC; background:#fff; color:var(--purple); font-size:16px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pdf-zoom-btn:active{ transform:scale(0.94); }
  .pdf-zoom-label{ font-size:12px; color:var(--ink-soft); min-width:38px; text-align:center; }
  audio.exam-audio{ width:100%; }

  .answer-toggle-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .answer-toggle-btn{
    background:var(--purple); color:#fff; border:none; border-radius:12px;
    padding:9px 16px; font-weight:700; font-size:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; flex-shrink:0;
  }
  .answer-toggle-btn:active{ transform:scale(0.97); }
  .answer-content{
    border-radius:14px; padding:16px; background:var(--lavender);
    font-size:13px; color:var(--ink); line-height:1.6; overflow:hidden;
    filter:blur(7px); user-select:none; pointer-events:none; transition:filter .25s ease;
  }
  .answer-content.revealed{ filter:blur(0); user-select:auto; pointer-events:auto; }
  .answer-content .answer-frame{ margin:-16px; width:calc(100% + 32px); border-radius:14px; }

  /* ---------------- Recent list ---------------- */
  .recent-list{ display:flex; flex-direction:column; gap:10px; margin-bottom:8px; }
  .recent-item{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border-radius:14px; padding:12px 14px;
    box-shadow:var(--shadow-card);
  }
  .recent-icon{
    width:40px; height:40px; border-radius:11px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:17px;
    background:var(--lavender);
  }
  .recent-body{ flex:1; min-width:0; }
  .recent-body .rt{ font-weight:600; font-size:13.5px; color:var(--ink); }
  .recent-body .rs{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .pill{ border-radius:999px; padding:4px 10px; font-size:10.5px; font-weight:700; flex-shrink:0; }
  .pill.good{ background:var(--green-bg); color:var(--green-ink); }
  .pill.mid{ background:var(--orange-bg); color:var(--orange-ink); }
  .empty-block{
    background:var(--white); border-radius:14px; padding:22px; text-align:center;
    color:var(--ink-soft); font-size:13px; box-shadow:var(--shadow-card);
  }

  /* ---------------- Generic page header (Learn / Stats) ---------------- */
  .page-topbar{ display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px; border:none; background:var(--white);
    display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
    box-shadow:var(--shadow-card); color:var(--ink);
  }
  .icon-btn svg{ width:18px; height:18px; }
  .page-topbar h1{ font-size:18px; margin:0; flex:1; }

  /* ---------------- Learn page ---------------- */
  .segmented{
    display:flex; background:var(--white); border-radius:14px; padding:4px;
    box-shadow:var(--shadow-card); margin-bottom:14px;
  }
  .seg-btn{
    flex:1; border:none; background:none; padding:10px 6px; border-radius:11px;
    font-weight:600; font-size:12.5px; color:var(--ink-soft); cursor:pointer;
  }
  .seg-btn.active{ background:var(--purple); color:#fff; }
  .learn-meta{ font-size:12px; color:var(--ink-soft); margin-bottom:12px; }
  .learn-list{ display:flex; flex-direction:column; gap:8px; }
  .learn-row{
    background:var(--white); border-radius:14px; padding:13px 14px;
    box-shadow:var(--shadow-card); cursor:pointer;
  }
  .learn-row-top{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .learn-num{
    width:26px; height:26px; border-radius:8px; background:var(--lavender); color:var(--purple-mid);
    font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .learn-hanzi{ font-weight:600; font-size:16px; color:var(--ink); flex-shrink:0; max-width:100%; }
  .learn-hanzi.sentence{ font-size:13.5px; flex-basis:100%; }
  .learn-pinyin{ font-size:11.5px; color:var(--ink-soft); flex-shrink:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .learn-mean-preview{ flex:1 1 100%; min-width:0; font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:left; order:5; }
  .learn-chevron{ margin-left:auto; }
  .learn-chevron{ width:14px; height:14px; color:var(--ink-faint); flex-shrink:0; transition:transform .15s ease; }
  .learn-row.open .learn-chevron{ transform:rotate(90deg); }
  .learn-detail{ display:none; margin-top:12px; padding-top:12px; border-top:1px solid var(--lavender); }
  .learn-row.open .learn-detail{ display:block; }
  .learn-detail .meaning{ font-size:13.5px; color:var(--ink); font-weight:600; margin-bottom:8px; }
  .learn-detail .example{ background:var(--lavender); border-radius:10px; padding:10px 12px; }
  .learn-detail .ex-zh{ font-family:'Noto Sans SC','Inter',sans-serif; font-size:14px; color:var(--ink); margin-bottom:2px; }
  .learn-detail .ex-py{ font-size:11.5px; color:var(--purple-mid); font-style:italic; margin-bottom:4px; }
  .learn-detail .ex-en{ font-size:12px; color:var(--ink-soft); }
  .learn-detail .play-row{ margin-top:8px; }
  .mini-play{
    display:inline-flex; align-items:center; gap:5px; background:var(--purple); color:#fff;
    border:none; border-radius:999px; padding:6px 12px; font-size:11px; font-weight:600; cursor:pointer;
  }
  .mini-play svg{ width:10px; height:10px; }
  .no-results{ text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 0; }
  .load-more-row{ text-align:center; margin-top:14px; }
  .load-more-btn{
    background:var(--white); border:none; border-radius:12px; padding:11px 20px;
    font-weight:600; font-size:12.5px; color:var(--purple); cursor:pointer; box-shadow:var(--shadow-card);
  }

  /* ---------------- Quiz screen ---------------- */
  .quiz-topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .quiz-title{ font-size:16px; font-weight:700; color:var(--ink); }

  .timer-ring .tval{

  .q-meta{ margin-bottom:16px; }
  .q-count{ font-size:13px; color:var(--ink-soft); margin-bottom:8px; font-weight:600; }
  .q-count b{ color:var(--purple); font-weight:700; }

  .progress-fill{ height:100%; background:var(--purple); border-radius:99px; transition:width .3s ease; }

  .q-card{
    background:var(--pink);

    text-align:center;
    margin-bottom:20px;

  .q-hanzi.sentence{ font-size:26px; }
  .q-pinyin{ font-size:14px; color:var(--pink-ink); font-style:italic; margin-top:6px; }
  .q-play{
    position:absolute; top:16px; right:16px; width:34px; height:34px; border-radius:50%;
    background:#fff; border:none; display:flex; align-items:center; justify-content:center; cursor:pointer;
    color:var(--pink-ink); box-shadow:0 4px 10px rgba(0,0,0,0.08);
  }
  .q-play svg{ width:15px; height:15px; }

  .options{ display:flex; flex-direction:column; gap:10px; margin-bottom:18px; }
  .option{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border:2px solid transparent; border-radius:14px;
    padding:13px 15px; text-align:left; cursor:pointer;
    box-shadow:var(--shadow-card);
    font-size:13.5px; color:var(--ink);
    transition:border-color .12s ease, background .12s ease;
  }
  .opt-letter{
    width:26px; height:26px; border-radius:9px; background:var(--lavender); color:var(--purple-mid);
    font-weight:700; font-size:12px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .option:hover:not(.locked){ border-color:var(--lavender-deep); }
  .option.selected{ border-color:var(--purple); background:var(--lavender); }
  .option.correct{ border-color:var(--green-ink); background:var(--green-bg); }
  .option.correct .opt-letter{ background:var(--green-ink); color:#fff; }
  .option.incorrect{ border-color:var(--red-ink); background:var(--red-bg); }
  .option.incorrect .opt-letter{ background:var(--red-ink); color:#fff; }
  .option.locked{ cursor:default; }
  .option.dim{ opacity:0.5; }

  .feedback-row{ min-height:22px; text-align:center; font-size:12.5px; font-weight:700; margin-bottom:10px; }
  .feedback-row.ok{ color:var(--green-ink); }
  .feedback-row.no{ color:var(--red-ink); }

  .primary-btn{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:var(--purple); color:#fff; font-weight:700; font-size:14.5px;
    cursor:pointer; box-shadow:var(--shadow-btn);
  }
  .primary-btn:disabled{ opacity:0.35; cursor:default; box-shadow:none; }
  .primary-btn:active:not(:disabled){ transform:scale(0.985); }

  /* ---------------- Results screen ---------------- */
  .results-wrap{ padding-top:26px; text-align:center; position:relative; min-height:calc(100vh - 40px); }
  .confetti{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .confetti span{ position:absolute; font-size:16px; opacity:0.55; }
  .results-avatar-wrap{ position:relative; width:180px; height:180px; margin:10px auto 22px; }
  .results-avatar-ring{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 70%);
  }
  .results-avatar{
    position:absolute; inset:22px; border-radius:50%;
    background:linear-gradient(135deg, #C77DFF, #9D4EDD);

  .results-score{ color:#fff; font-family:'Poppins',sans-serif; font-weight:800; font-size:38px; margin:6px 0 10px; }
  .results-title{ color:#fff; font-family:'Poppins',sans-serif; font-weight:700; font-size:21px; margin-bottom:8px; }
  .results-sub{ color:rgba(255,255,255,0.7); font-size:13.5px; margin-bottom:18px; padding:0 20px; }
  .results-points{
    display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12);

  }
  .results-actions{ display:flex; flex-direction:column; gap:10px; padding:0 4px; }
  .results-btn-primary{
    width:100%; padding:15px; border-radius:14px; border:none;
    background:#fff; color:var(--purple); font-weight:700; font-size:14.5px; cursor:pointer;
  }
  .results-btn-secondary{
    width:100%; padding:15px; border-radius:14px; border:1.5px solid rgba(255,255,255,0.3);
    background:none; color:#fff; font-weight:700; font-size:14.5px; cursor:pointer;
  }

  /* ---------------- Notifications toggle ---------------- */
  .notif-card{
    display:flex; align-items:center; gap:12px;
    background:var(--white); border-radius:16px; padding:14px 16px;
    box-shadow:var(--shadow-card); margin-bottom:14px;
  }
  .notif-card .notif-icon{ font-size:20px; flex-shrink:0; }
  .notif-card .notif-body{ flex:1; min-width:0; }
  .notif-card .notif-title{ font-weight:700; font-size:13.5px; color:var(--ink); }
  .notif-card .notif-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }

    padding:8px 14px; font-weight:700; font-size:12px;

  .notif-toggle.off{ background:var(--lavender); color:var(--purple); }
  .notif-toggle.blocked{ background:var(--red-bg); color:var(--red-ink); cursor:default; }

  /* ---------------- Stats page ---------------- */
  .stat-cards{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px; }
  .stat-card{ background:var(--white); border-radius:16px; padding:16px; box-shadow:var(--shadow-card); }
  .stat-card .sv{ font-family:'Poppins',sans-serif; font-weight:800; font-size:22px; color:var(--ink); }
  .stat-card .sl{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; font-weight:600; }
  .stats-section{ margin-bottom:22px; }
  .cycle-card{ background:var(--white); border-radius:14px; padding:14px; box-shadow:var(--shadow-card); margin-bottom:10px; }
  .cycle-label{ display:flex; justify-content:space-between; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }
  .cycle-bar{ height:8px; background:var(--lavender-deep); border-radius:99px; overflow:hidden; }
  .cycle-bar-fill{ height:100%; background:linear-gradient(90deg, var(--purple-mid), var(--purple)); border-radius:99px; }
  .trend-chart{ display:flex; align-items:flex-end; gap:5px; height:80px; background:var(--white); border-radius:14px; padding:14px 10px 8px; box-shadow:var(--shadow-card); }
  .trend-bar{ flex:1; background:linear-gradient(180deg, var(--purple-mid), var(--purple)); border-radius:4px 4px 0 0; min-height:3px; }
  .weak-list{ display:flex; flex-direction:column; gap:8px; }
  .weak-item{ display:flex; align-items:center; gap:12px; background:var(--white); border-radius:14px; padding:11px 14px; box-shadow:var(--shadow-card); }
  .weak-item .wh{ font-family:'Noto Sans SC',sans-serif; font-weight:700; font-size:16px; width:auto; color:var(--ink); flex-shrink:0; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .weak-item .wm{ flex:1; font-size:12px; color:var(--ink-soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .weak-item .wb{ font-size:10.5px; font-weight:700; color:#fff; background:var(--red-ink); border-radius:999px; padding:3px 9px; flex-shrink:0; }
  .reset-row{ text-align:center; margin-top:8px; }
  .link-danger{ background:none; border:none; color:var(--ink-faint); font-size:12px; cursor:pointer; text-decoration:underline; }
  .link-danger:hover{ color:var(--red-ink); }

  @media (max-width:360px){

    .results-score{ font-size:32px; }
  }

    .learn-row{ padding:11px 12px; }
    .learn-hanzi{ font-size:15px; }
    .learn-pinyin{ font-size:11px; }
    .learn-mean-preview{ font-size:11.5px; }
    .culture-card{ width:148px; height:180px; }
    .nav-item{ max-width:56px; }
  }
  @media (max-width:340px){
    .culture-card{ width:132px; height:168px; }
  }

  /* ---------------- Gamification: header strip ---------------- */
  .gami-row{ display:flex; gap:8px; margin-bottom:16px; }
  .gami-pill{
    flex:1; display:flex; align-items:center; gap:7px;
    background:var(--white); border-radius:14px; padding:9px 11px;
    box-shadow:var(--shadow-card);
  }
  .gami-pill .gp-icon{ font-size:16px; flex-shrink:0; }
  .gami-pill .gp-val{ font-family:'Poppins',sans-serif; font-weight:800; font-size:14px; color:var(--ink); line-height:1.1; }
  .gami-pill .gp-lbl{ font-size:9.5px; color:var(--ink-soft); font-weight:600; text-transform:uppercase; letter-spacing:0.3px; }
  .level-bar-wrap{ background:var(--white); border-radius:14px; padding:11px 14px; box-shadow:var(--shadow-card); margin-bottom:16px; }
  .level-bar-top{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700; color:var(--ink-soft); margin-bottom:7px; }
  .level-bar-top b{ color:var(--purple); font-family:'Poppins',sans-serif; }
  .level-bar-track{ height:7px; background:var(--lavender-deep); border-radius:99px; overflow:hidden; }
  .level-bar-fill{ height:100%; background:linear-gradient(90deg, var(--pink-ink), var(--purple-mid)); border-radius:99px; transition:width .4s ease; }

  /* ---------------- Nickname modal ---------------- */
  .nick-overlay{
    position:fixed; inset:0; z-index:100; background:rgba(28,11,74,0.55);
    display:flex; align-items:center; justify-content:center; padding:24px;
    backdrop-filter:blur(3px);
  }
  .nick-card{
    background:#fff; border-radius:22px; padding:26px 22px; max-width:360px; width:100%;
    box-shadow:0 20px 50px rgba(20,10,50,0.35); text-align:center;
  }
  .nick-emoji{ font-size:38px; margin-bottom:8px; }
  .nick-card h2{ font-family:'Poppins',sans-serif; font-size:19px; margin:0 0 6px; color:var(--ink); }
  .nick-card p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; line-height:1.4; }
  .nick-input{
    width:100%; border:1.5px solid var(--lavender-deep); border-radius:14px; padding:13px 14px;
    font-size:15px; font-family:'Inter',sans-serif; text-align:center; margin-bottom:14px; outline:none; color:var(--ink);

  .nick-save-btn{

    font-weight:700; font-size:14.5px; cursor:pointer; box-shadow:var(--shadow-btn);
  }
  .nick-save-btn:disabled{ opacity:0.4; }
  .nick-hint{ font-size:10.5px; color:var(--ink-faint); margin-top:10px; }

  /* ---------------- Avatar picker ---------------- */
  .avatar-grid{ display:grid; grid-template-columns:repeat(5,1fr); gap:8px; margin-bottom:16px; }
  .avatar-opt{
    aspect-ratio:1; border-radius:14px; border:2px solid transparent; background:var(--lavender);

    transition:transform .12s ease, border-color .12s ease, background .12s ease;

  .avatar-emoji{ font-size:20px; line-height:1; }
  .avatar-big-emoji{ font-size:34px; line-height:1; }
  .nick-cancel-btn{
    width:100%; padding:12px; border-radius:14px; border:none; background:none;
    color:var(--ink-soft); font-weight:600; font-size:13px; cursor:pointer; margin-top:8px;
  }

  /* ---------------- Profile edit affordance ---------------- */
  .avatar-wrap{ position:relative; }
  .avatar-edit-btn{
    position:absolute; bottom:-3px; right:-3px; width:20px; height:20px; border-radius:50%;

    justify-content:center; font-size:10px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }

    background:none; border:none; color:var(--purple-mid); font-weight:700; font-size:11px;
    cursor:pointer; padding:0; margin-top:2px; text-decoration:underline;
  }

  /* ---------------- Engagement extras ---------------- */
  @keyframes flamePulse{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }
  .gami-pill .gp-icon.streak-flame{ display:inline-block; }
  .gami-pill:has(.gp-val:not(:empty)) .streak-flame{ animation:flamePulse 1.6s ease-in-out infinite; }
  .wotd-card{
    background:linear-gradient(135deg, #FFF6E9, #FDECD3); border-radius:18px; padding:16px 18px;
    margin-bottom:20px; box-shadow:var(--shadow-card); display:flex; align-items:center; gap:14px;
  }
  .wotd-eyebrow{ font-size:10px; font-weight:800; color:var(--orange-ink); text-transform:uppercase; letter-spacing:0.6px; }

  .wotd-mean{ font-size:12px; color:var(--ink-soft); }

  @keyframes badgePop{ 0%{ transform:scale(0.7); } 60%{ transform:scale(1.08); } 100%{ transform:scale(1); } }

  /* ---------------- Leaderboard ---------------- */
  .lb-me-card{
    display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, #4A24A0, #2C1266);
    border-radius:16px; padding:14px 16px; margin-bottom:16px; box-shadow:var(--shadow-btn);

  .lb-points{ font-family:'Poppins',sans-serif; font-weight:800; font-size:14px; color:var(--purple); flex-shrink:0; }
  .lb-loading{ text-align:center; padding:40px 10px; color:var(--ink-soft); font-size:13px; }

  .lb-tabs{ display:flex; gap:8px; background:var(--white); border-radius:14px; padding:5px; margin-bottom:16px; box-shadow:var(--shadow-card); }

  /* ---------------- Challenge button ---------------- */
  .challenge-btn{

    border-radius:99px; padding:4px 9px; font-size:10px; font-weight:700; cursor:pointer;

/* ============================= BROWSER NOTIFICATIONS ============================= */
/* These fire while this tab/PWA is open (foreground or backgrounded) — they are
   NOT true "app closed" push notifications, which would need FCM/VAPID setup and
   a server-side trigger. This is the browser Notification API.
   IMPORTANT: Chrome on Android refuses `new Notification()` called directly from a
   page — it only allows notifications shown via a registered service worker's
   registration.showNotification(). So we register sw.js and always go through it
   when available, falling back to the plain constructor only if there's no
   service worker support (older/other browsers). */
const NOTIF_SUPPORTED = (typeof Notification !== 'undefined');
const SW_SUPPORTED = ('serviceWorker' in navigator);
let swRegistration = null;
async function ensureServiceWorker(){
  if(!SW_SUPPORTED) return null;
  if(swRegistration) return swRegistration;
  try{ swRegistration = await navigator.serviceWorker.register('./sw.js'); try{ swRegistration.update(); }catch(_){} return swRegistration; }
  catch(e){ console.warn('Service worker registration failed', e); return null; }
}
if(SW_SUPPORTED) ensureServiceWorker();

const notifKey = 'hsk4_notified_events';
function getNotifiedSet(){
  try{ return new Set(JSON.parse(localStorage.getItem(notifKey) || '[]')); }catch(e){ return new Set(); }
}
function saveNotifiedSet(set){
  try{
    const arr = Array.from(set);
    // keep this bounded so it doesn't grow forever
    localStorage.setItem(notifKey, JSON.stringify(arr.slice(-300)));
  }catch(e){}
}
function notifPermission(){ return NOTIF_SUPPORTED ? Notification.permission : 'unsupported'; }

async function requestNotifPermission(){
  if(!NOTIF_SUPPORTED) return 'unsupported';
  try{
    const perm = await Notification.requestPermission();
    if(perm === 'granted') await ensureServiceWorker();
    renderNotifCardInPlace();
    return perm;
  }catch(e){ return 'denied'; }
}

async function fireNotification(title, body, tag){
  if(!NOTIF_SUPPORTED || Notification.permission !== 'granted') return;
  const reg = await ensureServiceWorker();
  if(reg && reg.showNotification){
    try{ await reg.showNotification(title, { body, tag, renotify: false }); return; }
    catch(e){ console.warn('showNotification failed, falling back', e); }
  }
  // Fallback for browsers without service worker support (desktop-only path;
  // Chrome for Android will throw here, which is why we try the SW route first).
  try{
    const n = new Notification(title, { body, tag, renotify: false });
    n.onclick = ()=>{ window.focus(); lbTab = 'matches'; navigate('leaderboard', true); n.close(); };
  }catch(e){ console.warn('Notification fallback failed', e); }
}

/* Polls for challenge-received / challenge-accepted events relevant to me and
   fires a local notification for any I haven't already notified on this device. */
async function checkMatchNotifications(){
  if(!STATE || !STATE.userId) return;
  let all;
  try{ all = await fetchAllMatches(); }catch(e){ return; }
  try{ await settleStaleMatches(all); }catch(e){ console.warn('settle failed', e); }   // credits finished matches (first finisher's win, etc.)
  if(!NOTIF_SUPPORTED || Notification.permission !== 'granted') return;
  const seen = getNotifiedSet();
  let changed = false;
  all.forEach(m=>{
    const role = m.fromUserId === STATE.userId ? 'from' : (m.toUserId === STATE.userId ? 'to' : null);
    if(!role) return;
    if(m.status === 'pending' && role === 'to'){
      const key = m.id + ':pending';
      if(!seen.has(key)){
        fireNotification('New challenge!', `${m.fromNickname||'Someone'} challenged you to a match.`, key);
        seen.add(key); changed = true;
      }
    }
    if(m.status === 'done'){
      const key = m.id + ':done';
      if(!seen.has(key)){
        const mine = role==='from' ? m.fromScore : m.toScore, theirs = role==='from' ? m.toScore : m.fromScore;
        const res = m.winnerUserId === null ? 'It was a tie' : (m.winnerUserId === STATE.userId ? 'You won' : 'You lost');
        fireNotification('Match finished', `${res}! You ${mine} — ${theirs} them.`, key);
        seen.add(key); changed = true;
      }
    }
    if(m.status === 'active' && role === 'from'){
      const key = m.id + ':active';
      if(!seen.has(key)){
        fireNotification('Challenge accepted!', `${m.toNickname||'Your opponent'} accepted — the match is live now.`, key);
        seen.add(key); changed = true;
      }
    }
  });
  if(changed) saveNotifiedSet(seen);
}

let notifPollTimer = null;
function startNotifPolling(){
  if(notifPollTimer) return;
  checkMatchNotifications();
  notifPollTimer = setInterval(checkMatchNotifications, 20000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) checkMatchNotifications(); });
}

function renderNotifCardHtml(){
  if(!NOTIF_SUPPORTED){
    return `
      <div class="notif-card">
        <div class="notif-icon">${ic('bell-off')}</div>
        <div class="notif-body">
          <div class="notif-title">Notifications</div>
          <div class="notif-sub">Not supported in this browser.</div>
        </div>
      </div>
    `;
  }
  const perm = notifPermission();
  const label = perm === 'granted' ? 'On' : (perm === 'denied' ? 'Blocked' : 'Turn on');
  const cls = perm === 'granted' ? 'on' : (perm === 'denied' ? 'blocked' : 'off');
  const sub = perm === 'granted'
    ? "You'll be notified of new challenges and accepts while the app is open."
    : (perm === 'denied'
      ? "Blocked in your browser settings — re-enable it there to get challenge alerts."
      : "Get notified when someone challenges you or accepts your challenge.");
  return `
    <div class="notif-card">
      <div class="notif-icon">${ic('bell')}</div>
      <div class="notif-body">
        <div class="notif-title">Match notifications</div>
        <div class="notif-sub">${sub}</div>
      </div>
      <button class="notif-toggle ${cls}" id="notifToggleBtn" ${perm==='denied'?'disabled':''}>${label}</button>
    </div>
  `;
}
function renderNotifCardInPlace(){
  const wrap = document.querySelector('.notif-card');
  if(!wrap) return;
  wrap.outerHTML = renderNotifCardHtml();
  wireNotifToggle();
}
function wireNotifToggle(){
  const btn = document.getElementById('notifToggleBtn');
  if(!btn) return;
  btn.onclick = async ()=>{
    if(notifPermission() === 'granted') return;
    const perm = await requestNotifPermission();
    if(perm === 'granted') startNotifPolling();
  };
}

const hasClaudeStorage = (typeof window.storage !== 'undefined' && window.storage);
async function storeSet(key, value){
  if(hasClaudeStorage){
    try{ await window.storage.set(key, JSON.stringify(value)); return; }catch(e){}
  }
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}
async function storeGet(key, fallback){
  if(hasClaudeStorage){
    try{ const r = await window.storage.get(key); if(r && r.value) return JSON.parse(r.value); }catch(e){}
  }
  try{ const v = localStorage.getItem(key); if(v) return JSON.parse(v); }catch(e){}
  return fallback;
}

const DEFAULT_STATE = {
  words: { remaining: WORDS.map(w=>w.id), cycle: 1, attempts:{}, correct:{}, wrong:{} },
  sentences: { remaining: SENTS.map(s=>s.id), cycle: 1, attempts:{}, correct:{}, wrong:{} },
  history: [],

  userId: '',

  claimedBadges: [],
  matchWins: 0,
  matchesPlayed: 0,
  streak: { count: 0, lastActive: null, freezes: 1 }
};

let STATE = null;

function genId(){
  try{ if(window.crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}

function authUser(){ return (fbAuth && fbAuth.currentUser) ? fbAuth.currentUser : null; }
// Each account gets its own saved profile/progress, so accounts on the same device never share data.
function stateKey(){ const u = authUser(); return u ? 'hsk4_state_' + u.uid : 'hsk4_state'; }
async function loadState(){
  const loaded = await storeGet(stateKey(), null);
  if(loaded){
    STATE = loaded;
    ['words','sentences'].forEach(t=>{
      if(!STATE[t]) STATE[t] = JSON.parse(JSON.stringify(DEFAULT_STATE[t]));
      const allIds = BY_TYPE[t].map(x=>x.id);
      const known = new Set(STATE[t].remaining);
      allIds.forEach(id=>{ if(!(id in STATE[t].attempts)) { if(!known.has(id)) STATE[t].remaining.push(id); } });
    });
    if(!STATE.history) STATE.history = [];
    if(typeof STATE.nickname !== 'string') STATE.nickname = '';
    if(typeof STATE.avatar !== 'string' || !STATE.avatar) STATE.avatar = '🐼';
    if(!STATE.userId) STATE.userId = genId();
    if(typeof STATE.bonusPoints !== 'number') STATE.bonusPoints = 0;
    if(typeof STATE.comboMax !== 'number') STATE.comboMax = 0;
    if(!Array.isArray(STATE.badges)) STATE.badges = [];
    if(!Array.isArray(STATE.claimedBadges)) STATE.claimedBadges = [];
    if(typeof STATE.matchWins !== 'number') STATE.matchWins = 0;
    if(typeof STATE.matchesPlayed !== 'number') STATE.matchesPlayed = 0;
    if(!STATE.streak) STATE.streak = { count: 0, lastActive: null, freezes: 1 };
  } else {
    STATE = JSON.parse(JSON.stringify(DEFAULT_STATE));
    STATE.userId = genId();
  }
  const au = authUser();
  if(au) STATE.userId = au.uid;   // one leaderboard identity per account
}
async function saveState(){
  if(fbAuth && !fbAuth.currentUser) return;   // signed out: never write a previous user's data
  await storeSet(stateKey(), STATE);
}

/* ============================= TTS ============================= */
let zhVoice = null;
function pickVoice(){
  const voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  zhVoice = voices.find(v=>v.lang === 'zh-CN') || voices.find(v=>v.lang && v.lang.startsWith('zh')) || null;
}
if(window.speechSynthesis){
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if(zhVoice) u.voice = zhVoice;
    u.rate = 0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

const correctSoundPool = [document.getElementById('correctSound0'), document.getElementById('correctSound1')];
correctSoundPool.forEach(el=>{
  el.src = CORRECT_SOUND_SRC;
  el.volume = 1.0;
  try{ el.load(); }catch(e){}
});
let correctSoundIdx = 0;

let audioCtx = null;
let masterGain = null;
let audioUnlocked = false;

function getAudioCtx(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; }
    // Master bus: a compressor so louder notes don't clip/distort, feeding a master gain for overall volume.
    const compressor = audioCtx.createDynamicsCompressor();
    compressor.threshold.setValueAtTime(-18, audioCtx.currentTime);
    compressor.knee.setValueAtTime(24, audioCtx.currentTime);
    compressor.ratio.setValueAtTime(4, audioCtx.currentTime);
    compressor.attack.setValueAtTime(0.003, audioCtx.currentTime);
    compressor.release.setValueAtTime(0.25, audioCtx.currentTime);
    masterGain = audioCtx.createGain();
    masterGain.gain.setValueAtTime(1.0, audioCtx.currentTime);
    compressor.connect(masterGain).connect(audioCtx.destination);
    audioCtx._bus = compressor; // sounds connect here
  }
  if(audioCtx.state === 'suspended'){ audioCtx.resume().catch(()=>{}); }
  return audioCtx;
}

/* Unlocks/warms up the AudioContext on the very first user touch/click anywhere in the app.
   Mobile browsers (especially in-app webviews) require this, otherwise the first real sound
   (often the results-screen celebration/sad chime) can silently fail to play. */
function unlockAudio(){
  if(audioUnlocked) return;
  const ctx = getAudioCtx();
  if(ctx){
    const buffer = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(ctx.destination);
    try{ src.start(0); }catch(e){}
    ctx.resume().then(()=>{ audioUnlocked = true; }).catch(()=>{ audioUnlocked = true; });
  }
  // Warm up the embedded answer-feedback clips too, muted, so the first real play isn't blocked.
  [...wrongSoundPool, ...correctSoundPool].forEach(el=>{
    try{
      el.muted = true;
      const p = el.play();
      if(p && typeof p.then === 'function'){
        p.then(()=>{ el.pause(); el.currentTime = 0; el.muted = false; }).catch(()=>{ el.muted = false; });
      } else {
        el.muted = false;
      }
    }catch(e){}
  });
}
['pointerdown','touchstart','click','keydown'].forEach(evt=>{
  document.addEventListener(evt, unlockAudio, { once:true, passive:true });
});

/* A single warm tone with a soft attack, gentle sine-based body and a touch of higher
   harmonic to keep it from sounding thin, even at higher volume. */
function tone(ctx, freq, startAt, duration, type, peakGain, detune){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type || 'sine';
  osc.frequency.setValueAtTime(freq, startAt);
  if(detune) osc.detune.setValueAtTime(detune, startAt);
  gain.gain.setValueAtTime(0.0001, startAt);
  gain.gain.exponentialRampToValueAtTime(peakGain||0.35, startAt+0.012);
  gain.gain.exponentialRampToValueAtTime(Math.max(peakGain*0.35,0.001), startAt+duration*0.55);
  gain.gain.exponentialRampToValueAtTime(0.0001, startAt+duration);
  osc.connect(gain).connect(ctx._bus || ctx.destination);
  osc.start(startAt);
  osc.stop(startAt+duration+0.03);
  return { osc, gain };
}

/* A bell-like "chime": fundamental + a quiet octave-up overtone + a whisper-quiet fifth,
   for a fuller, more polished sound (like a marimba/glockenspiel ding) rather than a flat beep. */
function chime(ctx, freq, startAt, duration, peakGain){
  const gain = peakGain || 0.36;
  tone(ctx, freq, startAt, duration, 'sine', gain);
  tone(ctx, freq*2, startAt, duration*0.55, 'sine', gain*0.32);
  tone(ctx, freq*1.5, startAt+0.005, duration*0.4, 'triangle', gain*0.14);
}

function playCorrectSound(){
  // Play the uploaded "correct answer" clip using a small pool of real <audio> elements
  // (round-robin) so rapid repeats don't cut each other off.
  try{
    const el = correctSoundPool[correctSoundIdx];
    correctSoundIdx = (correctSoundIdx + 1) % correctSoundPool.length;
    el.currentTime = 0;
    el.muted = false;
    const p = el.play();
    if(p && typeof p.catch === 'function'){
      p.catch(()=> playCorrectSoundFallback());
    }
  }catch(e){
    playCorrectSoundFallback();
  }
}

/* Synthesized backup in case the audio file can't play. */
function playCorrectSoundFallback(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime;
  // Bright ascending two-note "ding-ding" — cheerful, not harsh
  chime(ctx, 987.77, t, 0.17, 0.38);       // B5
  chime(ctx, 1318.51, t+0.10, 0.26, 0.40); // E6
}

function playWrongSound(){
  // Play the uploaded "wrong answer" clip using a small pool of real <audio> elements
  // (round-robin) so rapid repeats don't cut each other off, and so playback doesn't
  // depend on cloneNode/JS-only Audio objects, which some mobile WebViews handle poorly.
  try{
    const el = wrongSoundPool[wrongSoundIdx];
    wrongSoundIdx = (wrongSoundIdx + 1) % wrongSoundPool.length;
    el.currentTime = 0;
    el.muted = false;
    const p = el.play();
    if(p && typeof p.catch === 'function'){
      p.catch(()=> playWrongSoundFallback());
    }
  }catch(e){
    playWrongSoundFallback();
  }
}

/* Synthesized backup in case the audio file can't play (e.g. blocked before the user has interacted). */
function playWrongSoundFallback(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime;
  const o1 = ctx.createOscillator();
  const g1 = ctx.createGain();
  o1.type = 'sine';
  o1.frequency.setValueAtTime(220, t);
  o1.frequency.exponentialRampToValueAtTime(146.83, t+0.22);
  g1.gain.setValueAtTime(0.0001, t);
  g1.gain.exponentialRampToValueAtTime(0.32, t+0.015);
  g1.gain.exponentialRampToValueAtTime(0.0001, t+0.26);
  o1.connect(g1).connect(ctx._bus || ctx.destination);
  o1.start(t); o1.stop(t+0.3);
  tone(ctx, 110, t+0.02, 0.18, 'sine', 0.16);
}

function playCelebrationSound(){
  const ctx = getAudioCtx();
  if(!ctx) return;
  const t = ctx.currentTime;
  // Triumphant ascending major arpeggio fanfare, finishing on a bright held chord
  chime(ctx, 523.25, t,      0.20, 0.34); // C5

}

/* ============================= UTIL ============================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pct(n,d){ return d>0 ? Math.round((n/d)*100) : 0; }
function esc(s){ return (s+'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function totalPoints(){
  let c = 0;
  ['words','sentences'].forEach(t=>{ Object.values(STATE[t].correct).forEach(v=>c+=v); });
  return c * 10 + (STATE.bonusPoints||0);
}

/* ============================= XP / LEVEL ============================= */
function levelInfo(points){
  const perLevel = 250;
  const level = Math.floor(points / perLevel) + 1;
  const into = points % perLevel;
  return { level, into, perLevel, pct: Math.round((into/perLevel)*100) };
}

/* ============================= WORD OF THE DAY ============================= */
function wordOfTheDay(){
  const dayIdx = Math.floor(Date.now() / 86400000);
  const idx = dayIdx % WORDS.length;
  return WORDS[idx];
}

/* ============================= STREAK ============================= */
function todayStr(){ return new Date().toISOString().slice(0,10); }
function updateStreak(){
  const st = STATE.streak;
  const today = todayStr();
  if(st.lastActive === today) return false;
  if(!st.lastActive){
    st.count = 1;
  } else {
    const diffDays = Math.round((new Date(today) - new Date(st.lastActive)) / 86400000);
    if(diffDays === 1){
      st.count += 1;
    } else if(diffDays > 1){
      const gap = diffDays - 1;
      if((st.freezes||0) >= gap){
        st.freezes -= gap;
        st.count += 1;
      } else {
        st.count = 1;
        st.freezes = 0;
      }
    }
  }
  st.lastActive = today;
  return true;
}

}

/* ============================= MATCHES (async 1v1 challenges) ============================= */
function genMatchId(){ return 'm_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function seededRng(seedStr){
  let h = 1779033703 ^ seedStr.length;
  for(let i=0;i<seedStr.length;i++){
    h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353);
    h = (h<<13) | (h>>>19);
  }
  return function(){
    h = Math.imul(h ^ (h>>>16), 2246822507);
    h = Math.imul(h ^ (h>>>13), 3266489909);
    h ^= h>>>16;
    return (h>>>0) / 4294967296;
  };
}
function seededShuffle(arr, rng){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(rng()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function drawFixedQuizIds(type, n){
  const allIds = BY_TYPE[type].map(x=>x.id);
  return shuffle(allIds).slice(0, n);
}
function buildMatchOptions(type, item, seedBase){
  const rng = seededRng(seedBase + '|' + item.id);
  const items = BY_TYPE[type];
  const correct = item.answer;
  const pool = items.filter(x => x.id !== item.id && x.answer !== correct);
  const distractors = seededShuffle(pool, rng).slice(0,3).map(x=>x.answer);
  return seededShuffle([correct, ...distractors], rng);
}

// Session-level optimistic cache: guards against a slow/failed backend read
// hiding a match the current user *just* created or updated.
const localMatchCache = new Map();

/* ---- Match sync: monotonic merge so one player's save can never wipe the other's result ---- */
const MATCH_RANK = { pending:0, expired:1, declined:1, active:2, done:3 };
function mergeMatchMonotonic(a, b){
  if(!a) return b ? Object.assign({}, b) : b;
  if(!b) return Object.assign({}, a);
  const out = Object.assign({}, ((b.updatedAt||0) > (a.updatedAt||0)) ? b : a);
  // A finished side never goes back to "not finished"; prefer copy a (the one being saved) when both are done.
  ['from','to'].forEach(side=>{
    const src = a[side+'Done'] ? a : (b[side+'Done'] ? b : null);
    if(src){ out[side+'Done'] = true; out[side+'Score'] = src[side+'Score']; }
    ['Notified','Counted','Rewarded'].forEach(k=>{ out[side+k] = !!(a[side+k] || b[side+k]); });
  });
  const ra = MATCH_RANK[a.status] ?? 0, rb = MATCH_RANK[b.status] ?? 0;
  out.status = ra >= rb ? a.status : b.status;
  [['quizDeadline'],['acceptDeadline']].forEach(([k])=>{
    const vals = [a[k], b[k]].filter(v=> v != null);
    out[k] = vals.length ? Math.min(...vals) : null;
  });
  if(out.fromDone && out.toDone){
    out.status = 'done';
    const fs = out.fromScore ?? 0, ts = out.toScore ?? 0;
    out.winnerUserId = (fs === ts) ? null : (fs > ts ? out.fromUserId : out.toUserId);
  }
  out.updatedAt = Math.max(a.updatedAt||0, b.updatedAt||0);
  return out;
}

async function pushMatch(match){
  match.updatedAt = Date.now();
  let merged = mergeMatchMonotonic(match, localMatchCache.get(match.id));
  let fbOk = false;
  if(fbReady){
    const ref = fbDb.collection('matches').doc(match.id);
    try{
      // Atomic read-merge-write: whatever the other player already saved is kept.
      merged = await fbDb.runTransaction(async (tx)=>{
        const snap = await tx.get(ref);
        const m2 = mergeMatchMonotonic(merged, snap.exists ? snap.data() : null);
        tx.set(ref, m2);
        return m2;
      });
      fbOk = true;
    }catch(e){
      console.warn('Firebase match transaction failed, retrying plain write', e);
      try{
        const snap = await ref.get();
        merged = mergeMatchMonotonic(merged, snap.exists ? snap.data() : null);
        await ref.set(merged, { merge:true });
        fbOk = true;
      }catch(e2){ console.warn('Firebase match push failed', e2); }
    }
  }
  if(hasClaudeStorage){
    try{
      let remote = null;
      try{ const r = await window.storage.get('match:'+match.id, true); if(r && r.value) remote = JSON.parse(r.value); }catch(_){}
      merged = mergeMatchMonotonic(merged, remote);
      await window.storage.set('match:'+match.id, JSON.stringify(merged), true);
    }catch(e){ console.warn('Claude storage match push failed', e); }
  }
  if(!fbOk && !hasClaudeStorage) console.warn('pushMatch: no backend available, match only exists locally this session');
  Object.assign(match, merged);          // caller's object now includes the opponent's latest result
  localMatchCache.set(match.id, match);
  return match;
}

async function fetchAllMatches(){
  let fbMatches = [];
  if(fbReady){
    try{
      const [snapA, snapB] = await Promise.all([
        fbDb.collection('matches').where('fromUserId','==',STATE.userId).get(),
        fbDb.collection('matches').where('toUserId','==',STATE.userId).get()
      ]);
      const map = {};
      snapA.docs.forEach(d=>{ map[d.id]=d.data(); });
      snapB.docs.forEach(d=>{ map[d.id]=d.data(); });
      fbMatches = Object.values(map);
    }catch(e){ console.warn('Firebase match fetch failed', e); }
  }
  let csMatches = [];
  if(hasClaudeStorage){
    try{
      const listRes = await window.storage.list('match:', true);
      const keys = (listRes && listRes.keys) || [];
      const reads = await Promise.all(keys.map(k=>window.storage.get(k, true).catch(()=>null)));
      const all = reads.filter(Boolean).map(r=>{ try{ return JSON.parse(r.value); }catch(e){ return null; } }).filter(Boolean);
      csMatches = all.filter(m=> m.fromUserId===STATE.userId || m.toUserId===STATE.userId);
    }catch(e){ console.warn('Claude storage match fetch failed', e); }
  }

  // Merge every source we have (Firebase, Claude shared storage, this session's
  // local cache) by id, keeping whichever copy of each match has the newest
  // updatedAt. This way a match never silently vanishes just because one backend
  // came back empty while another backend actually has the data.
  const merged = {};
  [...fbMatches, ...csMatches].forEach(m=>{ merged[m.id] = mergeMatchMonotonic(merged[m.id], m); });
  localMatchCache.forEach((m, id)=>{
    if(m.fromUserId !== STATE.userId && m.toUserId !== STATE.userId) return;
    merged[id] = mergeMatchMonotonic(merged[id], m);
  });
  return Object.values(merged);
}

async function createChallenge(opponent, chosenIds){
  const itemIds = (chosenIds && chosenIds.length) ? shuffle(chosenIds.slice()) : drawFixedQuizIds('words', 10);
  const now = Date.now();
  const match = {
    id: genMatchId(),
    fromUserId: STATE.userId, fromNickname: STATE.nickname||'Learner', fromAvatar: STATE.avatar||'🐼',
    toUserId: opponent.userId, toNickname: opponent.nickname||'Learner', toAvatar: opponent.avatar||'🐼',
    type: 'words', itemIds,
    status: 'pending', // waiting for opponent to accept
    acceptDeadline: now + MATCH_ACCEPT_WINDOW_MS,
    quizDeadline: null,
    fromScore: null, toScore: null, fromDone: false, toDone: false,
    fromNotified: false, toNotified: false,
    fromCounted: false, toCounted: false, fromRewarded: false, toRewarded: false,
    winnerUserId: null, createdAt: now, updatedAt: now
  };
  await pushMatch(match);
  return match;
}

/* Called once for the current user's own side of a match (whether they finished
   normally or timed out), so matchesPlayed/wins are only ever counted once per side. */
function settleMyMatchCompletion(m, role){
  // The ledger lives in this account's own saved data, so a match is counted / rewarded once
  // even if the shared match record is slow to sync.
  if(!STATE.matchLedger) STATE.matchLedger = {};
  const L = STATE.matchLedger[m.id] || (STATE.matchLedger[m.id] = {});
  const countKey = role==='from' ? 'fromCounted' : 'toCounted';
  const rewardKey = role==='from' ? 'fromRewarded' : 'toRewarded';
  if(!m[countKey] && !L.counted){ STATE.matchesPlayed = (STATE.matchesPlayed||0) + 1; }
  m[countKey] = true; L.counted = true;
  if(m.status === 'done' && m.winnerUserId === STATE.userId){
    if(!m[rewardKey] && !L.rewarded){
      STATE.bonusPoints = (STATE.bonusPoints||0) + 30;
      STATE.matchWins = (STATE.matchWins||0) + 1;
    }
    m[rewardKey] = true; L.rewarded = true;
  }
}

/* Auto-expires challenges nobody accepted in time, and auto-forfeits matches
   that went live but weren't finished before the shared time limit ran out. */
async function settleStaleMatches(matches){
  const now = Date.now();
  let changed = false;
  for(const m of matches){
    if(m.status === 'pending' && m.acceptDeadline && now > m.acceptDeadline){
      m.status = 'expired';
      changed = true;
      await pushMatch(m);
      continue;
    }
    if(m.status === 'active' && m.quizDeadline && now > m.quizDeadline && (!m.fromDone || !m.toDone)){
      if(!m.fromDone){ m.fromScore = m.fromScore ?? 0; m.fromDone = true; }
      if(!m.toDone){ m.toScore = m.toScore ?? 0; m.toDone = true; }
      m.status = 'done';
      m.winnerUserId = (m.fromScore === m.toScore) ? null : (m.fromScore > m.toScore ? m.fromUserId : m.toUserId);
      const myRole = m.fromUserId === STATE.userId ? 'from' : (m.toUserId === STATE.userId ? 'to' : null);
      if(myRole) settleMyMatchCompletion(m, myRole);
      changed = true;
      await pushMatch(m);
    }
    if(m.status === 'done'){
      const role = m.fromUserId === STATE.userId ? 'from' : (m.toUserId === STATE.userId ? 'to' : null);
      const L = (STATE.matchLedger && STATE.matchLedger[m.id]) || {};
      if(role && (!L.counted || (m.winnerUserId === STATE.userId && !L.rewarded))){
        settleMyMatchCompletion(m, role);
        changed = true;
        try{ await pushMatch(m); }catch(e){}
      }
    }
  }
  if(changed) await saveState();
  return matches;
}

let matchQuizCtx = null;
let matchQuizTimer = null;

function clearMatchQuizTimer(){ if(matchQuizTimer){ clearInterval(matchQuizTimer); matchQuizTimer = null; } }

/* Marks this user as having seen the match go live, then jumps into the quiz. */
async function launchMatchQuiz(match, role){
  const key = role==='from' ? 'fromNotified' : 'toNotified';
  if(!match[key]){ match[key] = true; await pushMatch(match); }
  startMatchQuiz(match, role);
}

function startMatchQuiz(match, role){
  matchQuizCtx = { match, role, idx:0, score:0, answered:false, deadline: match.quizDeadline };
  navigate('matchQuiz', true);
}

function startMatchCountdown(){
  clearMatchQuizTimer();
  updateMatchTimeDisplay();
  matchQuizTimer = setInterval(()=>{
    const left = matchQuizCtx.deadline - Date.now();
    updateMatchTimeDisplay();
    if(left <= 0){
      clearMatchQuizTimer();
      if(!matchQuizCtx.timedOut){
        matchQuizCtx.timedOut = true;
        alert("Time's up! Submitting your current progress.");
        finishMatchQuiz();
      }
    }
  }, 1000);
}

function updateMatchTimeDisplay(){
  const el = document.getElementById('matchTimeLeft');
  if(!el || !matchQuizCtx || !matchQuizCtx.deadline) return;
  const left = Math.max(0, matchQuizCtx.deadline - Date.now());
  el.innerHTML = ic('timer','btn-ic') + formatDuration(left);
  el.classList.toggle('urgent', left <= 30000);
}

function renderMatchQuizQuestion(){
  clearMatchQuizTimer();
  const m = matchQuizCtx.match;
  const item = BY_TYPE[m.type].find(x=>x.id===m.itemIds[matchQuizCtx.idx]);
  const options = buildMatchOptions(m.type, item, m.id);
  matchQuizCtx.answered = false;
  const oppName = matchQuizCtx.role==='from' ? m.toNickname : m.fromNickname;
  const progressPct = Math.round((matchQuizCtx.idx / m.itemIds.length) * 100);

  const html = `
    <div class="quiz-topbar">
      <button class="icon-btn" id="exitBtn" title="Exit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="quiz-title">${ic('swords','btn-ic')}vs ${esc(oppName)}</div>
      ${matchQuizCtx.deadline ? `<div class="match-time-left" id="matchTimeLeft"></div>` : `<div></div>`}
    </div>
    <div class="q-meta">
      <div class="q-count">Question <b>${matchQuizCtx.idx+1}</b> / ${m.itemIds.length}</div>
      <div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
    </div>
    <div class="q-card">
      <button class="q-play" id="replayBtn" title="Play audio">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      ${pyEyeBtn()}
      <div class="q-eyebrow">What does this word mean?</div>
      <div class="q-hanzi hanzi">${esc(item.hanzi)}</div>
      <div class="q-pinyin${pyHidden() ? ' py-hidden' : ''}" id="qPinyin">${esc(item.pinyin||'')}</div>
    </div>
    <div class="options" id="optionsWrap">
      ${options.map((opt,i)=>`
        <button class="option" data-opt="${esc(opt).replace(/"/g,'&quot;')}" data-idx="${i}">
          <span class="opt-letter">${String.fromCharCode(97+i)}</span>
          <span>${esc(opt)}</span>
        </button>
      `).join('')}
    </div>
    <div class="feedback-row" id="feedbackRow"></div>
    <button class="primary-btn" id="nextBtn" disabled>Next</button>
  `;
  document.getElementById('main').innerHTML = html;
  document.getElementById('exitBtn').onclick = ()=>{ if(confirm('Exit this match? Your progress in it will be lost.')){ clearMatchQuizTimer(); navigate('leaderboard'); } };
  document.getElementById('replayBtn').onclick = ()=> speak(item.hanzi);
  document.querySelectorAll('.option').forEach(btn=>{ btn.onclick = ()=> handleMatchAnswer(btn, item); });
  document.getElementById('nextBtn').onclick = advanceMatchQuiz;
  speak(item.hanzi);
  if(matchQuizCtx.deadline) startMatchCountdown();
}

function handleMatchAnswer(btn, item){
  if(matchQuizCtx.answered) return;
  matchQuizCtx.answered = true;
  const isCorrect = btn.getAttribute('data-opt') === item.answer;
  if(isCorrect){ matchQuizCtx.score++; playCorrectSound(); } else { playWrongSound(); }
  document.querySelectorAll('.option').forEach(o=>{
    o.classList.add('locked');
    const optVal = o.getAttribute('data-opt');
    if(optVal === item.answer) o.classList.add('correct');
    else if(o === btn) o.classList.add('incorrect');
    else o.classList.add('dim');
  });
  const fb = document.getElementById('feedbackRow');
  fb.className = 'feedback-row ' + (isCorrect ? 'ok' : 'no');
  fb.textContent = isCorrect ? 'Correct!' : 'Not quite — see the highlighted answer.';
  const nb = document.getElementById('nextBtn');
  nb.disabled = false;
  nb.textContent = (matchQuizCtx.idx === matchQuizCtx.match.itemIds.length-1) ? 'Finish Match' : 'Next';
}

function advanceMatchQuiz(){
  if(!matchQuizCtx || !matchQuizCtx.answered || matchQuizCtx.finishing) return;
  if(matchQuizCtx.idx === matchQuizCtx.match.itemIds.length-1){
    const nb = document.getElementById('nextBtn');
    if(nb){ nb.disabled = true; nb.textContent = 'Submitting…'; }   // one tap is enough
    finishMatchQuiz();
  }
  else { matchQuizCtx.idx++; renderMatchQuizQuestion(); }
}

async function finishMatchQuiz(){
  const ctx = matchQuizCtx;
  if(!ctx || ctx.finishing) return;          // never run twice (double tap / timer + tap)
  ctx.finishing = true;
  clearMatchQuizTimer();
  const m = ctx.match, role = ctx.role;
  if(role === 'from'){ m.fromScore = ctx.score; m.fromDone = true; }
  else { m.toScore = ctx.score; m.toDone = true; }
  if(m.fromDone && m.toDone){
    m.status = 'done';
    m.winnerUserId = (m.fromScore === m.toScore) ? null : (m.fromScore > m.toScore ? m.fromUserId : m.toUserId);
  }
  renderMatchResult(m, role, { saving:true });   // show the score immediately, sync in the background

  try{ await pushMatch(m); }catch(e){ console.warn('finish: push failed', e); }   // m now includes opponent's latest result
  let iWon = false;
  try{
    const beforeWins = STATE.matchWins || 0;
    const before = [m.fromCounted, m.toCounted, m.fromRewarded, m.toRewarded].join();
    settleMyMatchCompletion(m, role);
    iWon = (STATE.matchWins || 0) > beforeWins;
    if([m.fromCounted, m.toCounted, m.fromRewarded, m.toRewarded].join() !== before){ await pushMatch(m); }
    const newBadges = checkBadges();
    STATE.justUnlockedBadges = newBadges.map(b=>b.id);
    await saveState();
    try{ await pushLeaderboard(); }catch(e){ console.warn('leaderboard push failed', e); }
    try{ const seen = getNotifiedSet(); seen.add(m.id + ':done'); saveNotifiedSet(seen); }catch(e){}
  }catch(e){ console.warn('finish: settle failed', e); }
  if(iWon){ try{ playCelebrationSound(); }catch(e){} }
  if(document.getElementById('backToMatches')) renderMatchResult(m, role);   // final, with opponent's score if they are done
}

/* ============================= QUIZ ENGINE ============================= */
function drawQuizIds(type, n){
  const items = BY_TYPE[type];
  const allIds = items.map(x=>x.id);
  let remainingSet = new Set(STATE[type].remaining);
  if(remainingSet.size === 0) remainingSet = new Set(allIds);
  const selected = [];
  const excluded = new Set();
  let guard = 0;
  while(selected.length < n && guard < 5000){
    guard++;
    let candidates = [...remainingSet].filter(id=>!excluded.has(id));
    if(candidates.length === 0){
      STATE[type].cycle += 1;
      remainingSet = new Set(allIds);
      candidates = [...remainingSet].filter(id=>!excluded.has(id));
      if(candidates.length===0) break;
    }
    const pick = candidates[Math.floor(Math.random()*candidates.length)];
    selected.push(pick);
    excluded.add(pick);
  }
  STATE[type].remaining = [...remainingSet];
  return shuffle(selected);
}

function buildOptions(type, item){
  const items = BY_TYPE[type];
  const correct = item.answer;
  const pool = items.filter(x => x.id !== item.id && x.answer !== correct);
  const distractors = shuffle(pool).slice(0,3).map(x=>x.answer);
  const options = shuffle([correct, ...distractors]);
  return options;
}

let quizCtx = null;
let quizTimer = null;

function clearQuizTimer(){ if(quizTimer){ clearInterval(quizTimer); quizTimer = null; } }

function startQuiz(type){
  quizCtx = {
    type,
    ids: drawQuizIds(type, QUIZ_LEN),
    idx: 0,
    score: 0,
    perQuestionResult: [],
    answered: false,
    combo: 0,
    maxCombo: 0,
    bonusEarned: 0
  };
  saveState();
  navigate('quiz', true);
}

function currentItem(){
  const items = BY_TYPE[quizCtx.type];
  const id = quizCtx.ids[quizCtx.idx];
  return items.find(x=>x.id===id);
}

function ring(pctVal, size, stroke, color, trackColor){
  const r = (size - stroke) / 2, c = 2*Math.PI*r;
  const offset = c - (pctVal/100)*c;
  const cx = size/2;
  return `<svg width="${size}" height="${size}">
    <circle cx="${cx}" cy="${cx}" r="${r}" stroke="${trackColor}" stroke-width="${stroke}" fill="none"/>
    <circle cx="${cx}" cy="${cx}" r="${r}" stroke="${color}" stroke-width="${stroke}" fill="none"
      stroke-dasharray="${c}" stroke-dashoffset="${offset}" stroke-linecap="round"/>
  </svg>`;
}

function startCountdown(){
  updateTimerDisplay();
  quizTimer = setInterval(()=>{
    quizCtx.secondsLeft--;
    if(quizCtx.secondsLeft <= 0){
      updateTimerDisplay();
      clearQuizTimer();
      if(!quizCtx.answered) forceTimeout();
      return;
    }
    updateTimerDisplay();
  }, 1000);
}

function updateTimerDisplay(){
  const ringEl = document.getElementById('timerRing');
  if(!ringEl) return;
  const s = Math.max(quizCtx.secondsLeft, 0);
  const text = '00:' + String(s).padStart(2,'0');
  const pctVal = Math.round((s/QUESTION_SECONDS)*100);
  const color = s <= 5 ? 'var(--red-ink)' : 'var(--purple)';
  const urgent = s <= 5 ? ' urgent' : '';
  ringEl.innerHTML = ring(pctVal, 46, 4, color, 'var(--lavender-deep)') + `<div class="tval${urgent}" id="timerVal" style="color:${color}">${text}</div>`;
}

function forceTimeout(){
  if(quizCtx.answered) return;
  quizCtx.answered = true;
  const item = currentItem();
  const type = quizCtx.type;
  if(!STATE[type].attempts[item.id]) STATE[type].attempts[item.id] = 0;
  STATE[type].attempts[item.id]++;
  STATE[type].wrong[item.id] = (STATE[type].wrong[item.id]||0) + 1;
  if(!STATE[type].remaining.includes(item.id)) STATE[type].remaining.push(item.id);
  quizCtx.perQuestionResult[quizCtx.idx] = 'wrong';
  quizCtx.combo = 0;
  saveState();
  playWrongSound();

  document.querySelectorAll('.option').forEach(o=>{
    o.classList.add('locked');
    const optVal = o.getAttribute('data-opt');
    if(optVal === item.answer) o.classList.add('correct'); else o.classList.add('dim');
  });
  const fb = document.getElementById('feedbackRow');
  fb.className = 'feedback-row no';
  fb.textContent = "Time's up!";
  const cw0 = document.getElementById('comboWrap'); if(cw0) cw0.innerHTML = '';
  const nb = document.getElementById('nextBtn');
  nb.disabled = false;
  nb.textContent = (quizCtx.idx === quizCtx.ids.length-1) ? 'See Results' : 'Next';
}

function handleAnswer(btn, item){
  if(quizCtx.answered) return;
  quizCtx.answered = true;
  clearQuizTimer();
  const chosen = btn.getAttribute('data-opt');
  const isCorrect = chosen === item.answer;

  const type = quizCtx.type;
  if(!STATE[type].attempts[item.id]) STATE[type].attempts[item.id] = 0;
  STATE[type].attempts[item.id]++;

  let bonus = 0;
  if(isCorrect){
    STATE[type].correct[item.id] = (STATE[type].correct[item.id]||0) + 1;
    STATE[type].remaining = STATE[type].remaining.filter(id=>id!==item.id);
    quizCtx.score++;
    quizCtx.perQuestionResult[quizCtx.idx] = 'correct';
    quizCtx.combo += 1;
    quizCtx.maxCombo = Math.max(quizCtx.maxCombo, quizCtx.combo);
    bonus = Math.min(Math.floor(quizCtx.combo/3) * 5, 20);
    if(bonus > 0){ STATE.bonusPoints = (STATE.bonusPoints||0) + bonus; quizCtx.bonusEarned += bonus; }
    STATE.comboMax = Math.max(STATE.comboMax||0, quizCtx.maxCombo);
  } else {
    STATE[type].wrong[item.id] = (STATE[type].wrong[item.id]||0) + 1;
    if(!STATE[type].remaining.includes(item.id)) STATE[type].remaining.push(item.id);
    quizCtx.perQuestionResult[quizCtx.idx] = 'wrong';
    quizCtx.combo = 0;
  }
  saveState();
  if(isCorrect) playCorrectSound(); else playWrongSound();

  document.querySelectorAll('.option').forEach(o=>{
    o.classList.add('locked');
    const optVal = o.getAttribute('data-opt');
    if(optVal === item.answer) o.classList.add('correct');
    else if(o === btn) o.classList.add('incorrect');
    else o.classList.add('dim');
  });

  const fb = document.getElementById('feedbackRow');
  fb.className = 'feedback-row ' + (isCorrect ? 'ok' : 'no');
  fb.textContent = isCorrect ? ('Correct! +10' + (bonus>0 ? ` +${bonus} combo bonus` : '') + ' points') : 'Not quite — see the highlighted answer.';
  const cw = document.getElementById('comboWrap');
  if(cw) cw.innerHTML = quizCtx.combo >= 2 ? `<span class="combo-banner">${ic('flame','btn-ic')}${quizCtx.combo}x Combo!</span>` : '';

  const nb = document.getElementById('nextBtn');
  nb.disabled = false;
  nb.textContent = (quizCtx.idx === quizCtx.ids.length-1) ? 'See Results' : 'Next';
}

function advanceQuiz(){
  if(!quizCtx.answered) return;
  if(quizCtx.idx === quizCtx.ids.length-1){
    finishQuiz();
  } else {
    quizCtx.idx++;
    renderQuizQuestion();
  }
}

function finishQuiz(){
  clearQuizTimer();

  STATE.history.push({ date: new Date().toISOString(), type, score: quizCtx.score, total: quizCtx.ids.length, custom: !!quizCtx.custom });

    <div class="section-head"><h3>Featured Video</h3></div>
    <div class="video-card">
      <div class="video-frame-wrap">
        <a class="video-thumb-link" href="https://www.youtube.com/watch?v=4-uHuABGqc8" target="_blank" rel="noopener" title="Watch on YouTube">
          <img src="https://img.youtube.com/vi/4-uHuABGqc8/hqdefault.jpg" alt="Featured HSK video thumbnail" loading="lazy">
          <span class="play-btn"></span>
        </a>
      </div>
      <div class="video-caption">
        <div class="vt">Watch &amp; Learn</div>
        <div class="vs">A short video to sharpen your listening skills</div>
      </div>
    </div>
    <div class="section-head"><h3>Categories</h3><button class="see-all" id="seeAllCats">See all</button></div>
    <div class="cat-row">
      <button class="cat-tile" id="catWords">
        <div class="cat-icon" style="background:var(--lavender); color:var(--purple);">字</div>
        <div class="cat-label">Words</div>
      </button>
      <button class="cat-tile" id="catSentences">
        <div class="cat-icon" style="background:#DFF3E6; color:#28A15C;">句</div>
        <div class="cat-label">Sentences</div>
      </button>
      <button class="cat-tile" id="catLearn">
        <div class="cat-icon" style="background:#FDECD3; color:#DB8B26;">${ic('book-open')}</div>
        <div class="cat-label">Learn All</div>
      </button>
      <button class="cat-tile" id="catPick">
        <div class="cat-icon" style="background:#FFE9D6; color:#E8761F;">${ic('target')}</div>
        <div class="cat-label">My 10</div>
      </button>
      <button class="cat-tile" id="catWrite">
        <div class="cat-icon" style="background:#DFF3E6; color:#28A15C;">${ic('pencil')}</div>
        <div class="cat-label">Write</div>
      </button>
      <button class="cat-tile" id="catResources">
        <div class="cat-icon" style="background:var(--pink); color:var(--pink-ink);">${ic('file-text')}</div>
        <div class="cat-label">Resources</div>
      </button>
    </div>
    <div class="section-head"><h3>HSK1 Exams</h3></div>
    <div class="exam-scroll">
      ${HSK1_EXAMS.map(exam => `
        <button class="exam-card" data-exam="${exam.id}" style="background-image:url('${exam.bg}')">
          <div class="ec-body">
            <div class="ec-level">${esc(exam.level)}</div>
            <div class="ec-code">${esc(exam.code)}</div>
            <div class="ec-title">${esc(exam.title)}</div>
          </div>
        </button>
      `).join('')}
    </div>
    <div class="section-head"><h3>Recent</h3></div>
    <div class="recent-list">${recentHtml}</div>
  `;
  document.getElementById('main').innerHTML = html;
  document.getElementById('wotdPlay').onclick = ()=> speak(wotd.hanzi);
  document.getElementById('getStartedBtn').onclick = ()=> startQuiz('words');
  document.getElementById('catWords').onclick = ()=> startQuiz('words');
  document.getElementById('catSentences').onclick = ()=> startQuiz('sentences');
  document.getElementById('catLearn').onclick = ()=> navigate('learn');
  document.getElementById('catWrite').onclick = ()=> openWrite();
  document.getElementById('catPick').onclick = ()=> openPick();
  document.getElementById('catResources').onclick = ()=> navigate('resources');
  document.getElementById('seeAllCats').onclick = ()=> navigate('learn');
  document.querySelectorAll('.exam-card').forEach(btn=>{
    btn.onclick = ()=>{ currentExamId = btn.dataset.exam; navigate('examDetail'); };
  });
  const searchEl = document.getElementById('homeSearch');
  searchEl.onkeydown = (e)=>{
    if(e.key === 'Enter'){
      const q = searchEl.value.trim();
      navigate('learn');
      if(q){ setTimeout(()=>{ const inp = document.getElementById('learnSearch'); if(inp){ inp.value = q; inp.dispatchEvent(new Event('input')); } }, 0); }
